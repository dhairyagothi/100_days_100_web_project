name: Repository Statistics Generator

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    name: Generate repository-stats.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Allow the action to push changes back using the token provided by GitHub
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run repository stats generator
        # The generator is a simple Node script that reads projects.json and writes repository-stats.json
        run: |
          node --version
          node scripts/repo-stats.js

      - name: Commit and push updated repository-stats.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository-stats.json
          # Only commit if file changed
          if ! git diff --staged --quiet; then
            git commit -m "chore: update repository-stats.json [skip ci]"
            git push
          else
            echo "No changes to repository-stats.json"
          fi

# Notes:
# - This workflow runs daily and can be triggered manually via workflow_dispatch.
# - It uses the default GITHUB_TOKEN injected into workflows (available as secrets.GITHUB_TOKEN)
#   together with actions/checkout@v4 (persist-credentials) so it can push commits back to the repository.
# - The generator script must be cross-platform Node.js; it should exit non-zero on fatal errors so the job fails.