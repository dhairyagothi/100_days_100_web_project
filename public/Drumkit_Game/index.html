<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Drum Kit</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="../favv.png" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css?family=Arvo"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/jpg"
      href="https://i.postimg.cc/Twq1LX4g/favicon-32x32.png"
    />

  <body>
    <h1 id="title">Drum 🥁 Kit</h1>
    <div class="set">
      <div class="drum-container">
        <button class="w drum">Z</button>
        <p class="drum-label">do</p>
      </div>

      <div class="drum-container">
        <button class="a drum">X</button>
        <p class="drum-label">re</p>
      </div>

      <div class="drum-container">
        <button class="s drum">C</button>
        <p class="drum-label">mi</p>
      </div>

      <div class="drum-container">
        <button class="d drum">V</button>
        <p class="drum-label">fa</p>
      </div>

      <div class="drum-container">
        <button class="j drum">B</button>
        <p class="drum-label">so</p>
      </div>

      <div class="drum-container">
        <button class="k drum">N</button>
        <p class="drum-label">la</p>
      </div>

      <div class="drum-container">
        <button class="l drum">M</button>
        <p class="drum-label">ti</p>
      </div>
    </div>

    <script src="index.js" charset="utf-8"></script>
