<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Festival Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <!-- Calendar -->
        <div class="calendar-container">
            <!-- Month Banner -->
            <div id="month-image" class="month-image"></div>
            <!-- Header -->
            <div class="calendar-header">
                <button id="prevMonth" class="nav-btn" aria-label="Previous Month">
                    &#10094;
                </button>
                <div class="header-center">
                    <h2 id="monthYearText"></h2>
                </div>
                <div class="header-actions">
                    <button id="themeToggle" class="theme-btn" aria-label="Toggle Theme">
                        🌙
                    </button>
                    <button id="nextMonth" class="nav-btn" aria-label="Next Month">
                        &#10095;
                    </button>
                </div>
            </div>
            <!-- Calendar Grid -->
            <div class="calendar-grid">
                <div class="day-name">Sun</div>
                <div class="day-name">Mon</div>
                <div class="day-name">Tue</div>
                <div class="day-name">Wed</div>
                <div class="day-name">Thu</div>
                <div class="day-name">Fri</div>
                <div class="day-name">Sat</div>
            </div>
        </div>
        <!-- Notes -->
        <div id="noteArea" class="note-section">
            <h3>
                Notes for
                <span id="selectedDateText">
                    Select a day
                </span>
            </h3>
            <select id="eventTag" aria-label="Event Type">
                <option value="none">
                    Normal Day
                </option>
                <option value="festival">
                    Festival / Holiday
                </option>
                <option value="event">
                    Personal Event
                </option>
            </select>
            <textarea id="noteInput" placeholder="Write your notes here..." aria-label="Notes"></textarea>
            <button id="saveNote" aria-label="Save Note">
                Save Note
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
