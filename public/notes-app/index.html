<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">  
  <title>Notes App</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Icons -->
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <!-- Header -->
  <header class="app-header">
    <h1>📝 Notes App</h1>
  </header>

  <!-- Search -->
  <div class="search-bar">
    <i class="uil uil-search"></i>
    <input type="text" id="search-input" placeholder="Search notes...">
  </div>

  <!-- Popup -->
  <div class="popup-box">
    <div class="popup">
      <div class="content">

        <header>
          <p>Add New Note</p>
          <i class="uil uil-times close-btn"></i>
        </header>

        <form>

          <div class="row">
            <input type="text" id="title" placeholder="Title" required>
          </div>

          <div class="row">
            <textarea id="desc" placeholder="Write your note..." required></textarea>
          </div>

          <div class="row">
            <input type="text" id="tags" placeholder="Tags (comma separated)">
          </div>

          <div class="row password-field">
            <input type="password" id="password" placeholder="Password (optional)">
            <i class="uil uil-eye toggle-password"></i>
          </div>

          <button type="submit" class="add-btn">
            <i class="uil uil-plus"></i> Add Note
          </button>

        </form>
      </div>
    </div>
  </div>

  <!-- Notes -->
  <div class="wrapper">
    <div class="add-box">
      <div class="icon"><i class="uil uil-plus"></i></div>
      <p>Add new note</p>
    </div>
  </div>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
