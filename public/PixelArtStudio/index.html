<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Art Studio</title>
    <meta
      name="description"
      content="Feature-rich pixel art editor with animation timeline, multi-frame support, flood fill, undo/redo, and collaborative editing via BroadcastChannel."
    />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="app-header" id="appHeader">
      <div class="header-left">
        <div class="logo">
          <i class="fas fa-paint-brush"></i>
          <span>Pixel Art <strong>Studio</strong></span>
        </div>
      </div>
      <div class="header-center">
        <div class="canvas-size-selector">
          <label>Grid:</label>
          <select id="canvasSize">
            <option value="8">8 × 8</option>
            <option value="16" selected>16 × 16</option>
            <option value="32">32 × 32</option>
            <option value="64">64 × 64</option>
            <option value="128">128 × 128</option>
          </select>
        </div>
        <div class="zoom-controls">
          <button id="btnZoomOut" class="btn-icon" title="Zoom Out">
            <i class="fas fa-search-minus"></i>
          </button>
          <span id="zoomLevel" class="zoom-label">100%</span>
          <button id="btnZoomIn" class="btn-icon" title="Zoom In">
            <i class="fas fa-search-plus"></i>
          </button>
        </div>
      </div>
      <div class="header-right">
        <button id="btnUndo" class="btn-icon" title="Undo (Ctrl+Z)">
          <i class="fas fa-undo"></i>
        </button>
        <button id="btnRedo" class="btn-icon" title="Redo (Ctrl+Y)">
          <i class="fas fa-redo"></i>
        </button>
        <div class="separator"></div>
        <button id="btnExportPng" class="btn btn-sm btn-primary" title="Export">
          <i class="fas fa-download"></i> PNG
        </button>
        <button
          id="btnExportGif"
          class="btn btn-sm btn-accent"
          title="Export GIF"
        >
          <i class="fas fa-film"></i> GIF
        </button>
        <div class="separator"></div>
        <div
          class="collab-indicator"
          id="collabIndicator"
          title="Collaboration"
        >
          <i class="fas fa-users"></i>
          <span id="collabCount">1</span>
        </div>
      </div>
    </header>

    <main class="app-main" id="appMain">
      <!-- Left Toolbar -->
      <aside class="toolbar" id="toolbar">
        <div class="tool-group">
          <button class="tool-btn active" data-tool="pencil" title="Pencil (P)">
            <i class="fas fa-pencil-alt"></i>
          </button>
          <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
            <i class="fas fa-eraser"></i>
          </button>
          <button class="tool-btn" data-tool="fill" title="Fill Bucket (G)">
            <i class="fas fa-fill-drip"></i>
          </button>
          <button
            class="tool-btn"
            data-tool="eyedropper"
            title="Eyedropper (I)"
          >
            <i class="fas fa-eye-dropper"></i>
          </button>
          <button class="tool-btn" data-tool="line" title="Line (L)">
            <i class="fas fa-minus"></i>
          </button>
          <button class="tool-btn" data-tool="rect" title="Rectangle (R)">
            <i class="far fa-square"></i>
          </button>
          <button class="tool-btn" data-tool="circle" title="Circle (C)">
            <i class="far fa-circle"></i>
          </button>
          <button class="tool-btn" data-tool="move" title="Move (M)">
            <i class="fas fa-arrows-alt"></i>
          </button>
        </div>

        <div class="tool-divider"></div>

        <div class="tool-group">
          <div class="brush-size">
            <label>Size</label>
            <input type="range" id="brushSize" min="1" max="8" value="1" />
            <span id="brushSizeLabel">1</span>
          </div>
        </div>

        <div class="tool-divider"></div>

        <!-- Color Section -->
        <div class="color-section">
          <div class="color-swatches">
            <div class="current-colors">
              <div
                id="primaryColor"
                class="color-swatch primary"
                title="Primary Color"
              ></div>
              <div
                id="secondaryColor"
                class="color-swatch secondary"
                title="Secondary Color"
              ></div>
              <button id="btnSwapColors" class="btn-swap" title="Swap Colors">
                <i class="fas fa-exchange-alt"></i>
              </button>
            </div>
            <input type="color" id="colorPicker" value="#ffffff" />
          </div>
          <div class="palette" id="palette">
            <!-- Generated in JS -->
          </div>
        </div>
      </aside>

      <!-- Canvas Area -->
      <div class="canvas-area" id="canvasArea">
        <div class="canvas-container" id="canvasContainer">
          <canvas id="pixelCanvas"></canvas>
          <canvas id="gridOverlay"></canvas>
          <canvas id="previewOverlay"></canvas>
        </div>
        <div class="cursor-info" id="cursorInfo">
          <span id="cursorPos">0, 0</span>
        </div>
      </div>

      <!-- Right Panel -->
      <aside class="right-panel" id="rightPanel">
        <!-- Layers -->
        <section class="panel-section" id="layersSection">
          <div class="panel-header">
            <h3><i class="fas fa-layer-group"></i> Layers</h3>
            <div class="panel-actions">
              <button id="btnAddLayer" class="btn-icon-sm" title="Add Layer">
                <i class="fas fa-plus"></i>
              </button>
            </div>
          </div>
          <div id="layersList" class="layers-list">
            <!-- Generated in JS -->
          </div>
        </section>

        <!-- Preview -->
        <section class="panel-section">
          <div class="panel-header">
            <h3><i class="fas fa-eye"></i> Preview</h3>
          </div>
          <div class="preview-container">
            <canvas id="previewCanvas" width="128" height="128"></canvas>
          </div>
        </section>
      </aside>
    </main>

    <!-- Animation Timeline -->
    <footer class="timeline-bar" id="timelineBar">
      <div class="timeline-controls">
        <button id="btnPrevFrame" class="btn-icon-sm" title="Previous Frame">
          <i class="fas fa-step-backward"></i>
        </button>
        <button id="btnPlayAnim" class="btn-icon-sm btn-play" title="Play">
          <i class="fas fa-play"></i>
        </button>
        <button id="btnNextFrame" class="btn-icon-sm" title="Next Frame">
          <i class="fas fa-step-forward"></i>
        </button>
        <div class="fps-control">
          <label>FPS:</label>
          <input type="number" id="fpsInput" value="8" min="1" max="60" />
        </div>
        <label class="toggle-label onion-toggle">
          <input type="checkbox" id="onionSkinToggle" />
          <span>Onion Skin</span>
        </label>
      </div>
      <div class="timeline-frames" id="timelineFrames">
        <!-- Generated in JS -->
      </div>
      <div class="timeline-actions">
        <button
          id="btnAddFrame"
          class="btn btn-sm btn-outline"
          title="Add Frame"
        >
          <i class="fas fa-plus"></i> Frame
        </button>
        <button
          id="btnDuplicateFrame"
          class="btn btn-sm btn-outline"
          title="Duplicate Frame"
        >
          <i class="fas fa-copy"></i>
        </button>
        <button
          id="btnDeleteFrame"
          class="btn btn-sm btn-outline btn-danger-outline"
          title="Delete Frame"
        >
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
