<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Runner | Cyber Maze</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>MAZE RUNNER</h1>
        <div class="controls">
            <button data-diff="Easy">Easy</button>
            <button data-diff="Medium">Medium</button>
            <button data-diff="Hard">Hard</button>
        </div>
    </header>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">Steps</div>
            <div id="steps" class="stat-value">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Best</div>
            <div id="best" class="stat-value">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Grid</div>
            <div id="complexity" class="stat-value">10x10</div>
        </div>
        <button onclick="initGame(currentDifficulty)">Reset</button>
    </div>

    <div class="game-container">
        <canvas id="mazeCanvas" width="800" height="800"></canvas>
    </div>

    <div class="hint">
        Use <span>WASD</span> or <span>Arrows</span> to reach the fuchsia rift
    </div>

    <div id="winModal" class="modal">
        <div class="modal-content">
            <h2>ESCAPE SUCCESS</h2>
            <p>You navigated the labyrinth in <span id="finalSteps" style="color: var(--victory); font-weight: 800;">0</span> steps.</p>
            <button class="btn-large" onclick="initGame(currentDifficulty)">Next Run</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
