<!DOCTYPE html>
<html lang="en">

    name="viewport"

    name="description"
    content="Interactive Ball Bat Stump Cricket Game"
  />

  <title>Ball Bat Stump Game</title>

  <link
    rel="stylesheet"
    href="./style.css"
  />

    rel="preconnect"

  <main class="game-container">

    <section class="box1">

      <div class="heading-section">

        <h1>
          🏏 Ball Bat Stump Game
        </h1>

        <p class="subtitle">
          Play against the computer and track your score live.
        </p>

      </div>

      <div class="button-container">

        <button
          class="game_buttons"
          aria-label="Choose Bat"

          onclick="
            let usermsg = 'Bat';

            let computerchoice =
              computergeneratechoice();

            let cmpmsg = computerchoice;

            let result =
              getresult(
                usermsg,
                computerchoice
              );

            showresult(
              usermsg,
              cmpmsg,
              result
            );
          "
        >

          <img
            src="./bat.jpeg"
            class="game_image"
            alt="Bat"
          />

          <span>Bat</span>

        </button>

        <button
          class="game_buttons"
          aria-label="Choose Ball"

          onclick="
            let usermsg = 'Ball';

            let computerchoice =
              computergeneratechoice();

            let cmpmsg = computerchoice;

            let result =
              getresult(
                usermsg,
                computerchoice
              );

            showresult(
              usermsg,
              cmpmsg,
              result
            );
          "
        >

          <img
            src="./ball.jpeg"
            class="game_image"
            alt="Ball"
          />

          <span>Ball</span>

        </button>

        <button
          class="game_buttons"
          aria-label="Choose Stump"

          onclick="
            let usermsg = 'stump';

            let computerchoice =
              computergeneratechoice();

            let cmpmsg = computerchoice;

            let result =
              getresult(
                usermsg,
                computerchoice
              );

            showresult(
              usermsg,
              cmpmsg,
              result
            );
          "
        >

          <img
            src="./wickets.jpeg"
            class="game_image"
            alt="Wickets"
          />

          <span>Stump</span>

        </button>

      </div>

      </div>

    </section>

  </main>
