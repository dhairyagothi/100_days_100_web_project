<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Interactive Ball Bat Stump Cricket Game"
  >

  <title>Cricket Game</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="icon"
    href="../../favv.png"
    type="image/x-icon"
  >

</head>

<body>

  <div class="box1">

    <div class="heading-section">

      <h1>
        🏏 Ball Bat Stump Game
      </h1>

      <p class="subtitle">
        Play against the computer and track your score live.
      </p>

    </div>

    <div class="button-container">

      <button
        class="game_buttons"
        onclick="playGame('Bat')"
      >

        <img
          src="bat.jpeg"
          class="game-image"
          alt="Bat"
        >

        <span>Bat</span>

      </button>

      <button
        class="game_buttons"
        onclick="playGame('Ball')"
      >

        <img
          src="ball.jpeg"
          class="game-image"
          alt="Ball"
        >

        <span>Ball</span>

      </button>

      <button
        class="game_buttons"
        onclick="playGame('stump')"
      >

        <img
          src="wickets.jpeg"
          class="game-image"
          alt="Stump"
        >

        <span>Stump</span>

      </button>

    </div>

    <div class="show">

      <div class="result-card">

        <h2>Your Move</h2>

        <div id="user-move"></div>

      </div>

      <div class="result-card">

        <h2>Computer Move</h2>

        <div id="computer-move"></div>

      </div>

      <div class="result-card">

        <h2>Result</h2>

        <div id="result"></div>

      </div>

      <div class="result-card">

        <h2>Scoreboard</h2>

        <div id="score"></div>

      </div>

    </div>

    <button
      id="reset"
      onclick="resetscore()"
    >
      🔄 Reset Game
    </button>

  </div>

  <script src="script.js"></script>

</body>

</html>
