<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta http-equiv="X-UA-Compatible" content="IE=edge">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="style.css">
 <script src="script.js" defer></script>
 <title>Ping Pong Game</title>
</head>
<body>
 <div class="header">
  <img src="https://img.freepik.com/premium-vector/table-tennis-vector-logo-ping-pong-ball-with-emblem-shape-perfect-table-tennis_297778-950.jpg" alt="logo" width="60px">
  <div class="buttons">
   <button class="start-btn">Start</button>
   <button class="pause-btn">Pause</button>
   <button class="restart-btn">Restart</button>
  </div>
 </div>

 <div class="pong-wrapper">
  <canvas id="ping-pong" width="600px" height="400px"></canvas>
 </div>

 <!-- Game Over Modal -->
 <div id="gameModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="resultText">
  <div class="modal-content">
   <h2 id="resultText"></h2>
   <p id="finalScore"></p>
   <div class="modal-buttons">
    <button id="playAgainBtn">Play Again</button>
    <button id="closeBtn">Close</button>
   </div>
  </div>
 </div>
</body>
</html>
