<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta http-equiv="X-UA-Compatible" content="IE=edge">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="style.css">
 <script src="script.js" defer></script>
 <title>Ping Pong Game</title>
</head>
<body>
 <div class="header">
  <img src="https://img.freepik.com/premium-vector/table-tennis-vector-logo-ping-pong-ball-with-emblem-shape-perfect-table-tennis_297778-950.jpg" alt="logo" width="60px">
  <div class="buttons">
   <button class="start-btn">Start</button>
   <button class="pause-btn">Pause</button>
   <button class="restart-btn">Restart</button>
  </div>
  <div class="difficulty-buttons">
   <button class="difficulty-btn easy" data-difficulty="easy">Easy</button>
   <button class="difficulty-btn medium" data-difficulty="medium">Medium</button>
   <button class="difficulty-btn hard" data-difficulty="hard">Hard</button>
  </div>
 </div>

 <div class="pong-wrapper">
  <canvas id="ping-pong" width="600px" height="400px"></canvas>
  <div class="game-over-overlay" id="gameOverOverlay">
   <div class="game-over-content">
    <h2 id="winnerText">Player Wins!</h2>
    <button class="play-again-btn">Play Again</button>
   </div>
  </div>
 </div>
</body>
</html>
