<div class="container">
    <h1>🖼️ AI Image Classifier</h1>
    <p>Upload an image and let AI identify it!</p>

    <div class="drop-zone" id="dropZone">
        <p>📂 Drag & Drop Image Here</p>
        <span>or</span>

        <label for="imageUpload" class="upload-btn">
            Choose Image
        </label>
    </div>

    <input type="file" id="imageUpload" accept="image/*" hidden>

    <div id="error-message"></div>

    <div class="image-box">
        <img id="preview" src="placeholder.png" alt="Uploaded preview image">
    </div>

    <div class="actions">
        <button id="classifyBtn">Classify Image</button>
    </div>

    <div id="loading" class="hidden">
        <p>⏳ AI is analyzing the image...</p>
    </div>

    <div id="result" aria-live="polite"></div>

    <div id="confidence"></div>

    <footer>
        <p>Powered by TensorFlow.js & MobileNet</p>
    </footer>
</div>
