<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sign Up</title>

  <link rel="icon" href="favv.png" type="image/x-icon" />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #4a90e2, #1abc9c);
      color: white;
    }

    .navbar {
      padding: 15px 30px;
      background: #1c2833;
    }

    .nav-link {
      color: #f39c12;
      text-decoration: none;
      font-weight: 600;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 30px auto;
      display: flex;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    .left {
      flex: 1;
      padding: 60px 40px;
      color: black;
    }

    .left h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .highlight {
      color: #1abc9c;
    }

    .description {
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .feature-list {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .feature-card {
      background: #f5f5f5;
      padding: 12px 18px;
      border-radius: 10px;
    }

    .form-box {
      flex: 1;
      background: #111;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-box h2 {
      margin-bottom: 10px;
    }

    .form-subtitle {
      color: #bbb;
      margin-bottom: 20px;
    }

    #signupForm {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      outline: none;
    }

    .login-btn {
      background: #1abc9c;
      border: none;
      padding: 14px;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .signup-text {
      margin-top: 20px;
      text-align: center;
    }

    .signup-text a {
      color: #1abc9c;
      text-decoration: none;
    }

    @media (max-width: 900px) {

      .container {
        flex-direction: column;
      }

      .left,
      .form-box {
        width: 100%;
      }
    }

  </style>
</head>

<body>

  <header class="navbar">
    <a href="../index.html" class="nav-link">
      ← Back to Home
    </a>
  </header>

  <main class="container">

    <!-- Left Section -->
    <section class="left">

      <h1>
        Create Your
        <span class="highlight">Account</span>
      </h1>

      <p class="description">
        Join the 100 Days 100 Web Projects journey and improve your development skills through practical projects.
      </p>

      <div class="feature-list">
        <div class="feature-card">🎨 Creative Projects</div>
        <div class="feature-card">📚 Learn Daily</div>
        <div class="feature-card">🚀 Build Skills</div>
      </div>

    </section>

    <!-- Right Section -->
    <section class="form-box">

      <h2>Sign Up</h2>

      <p class="form-subtitle">
        Create your account to continue.
      </p>

      <form id="signupForm">

        <div class="form-group">
          <input
            type="text"
            id="name"
            placeholder="Full Name"
            required
          />
        </div>

        <div class="form-group">
          <input
            type="text"
            id="username"
            placeholder="Username"
            required
          />
        </div>

        <div class="form-group">
          <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
          />
        </div>

        <div class="form-group">
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
        </div>

        <button type="submit" class="login-btn">
          Sign Up
        </button>

      </form>

      <p class="signup-text">
        Already have an account?
        <a href="./login.html">Login</a>
      </p>

    </section>

  </main>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function (event) {

      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (name && username && email && password) {

        localStorage.setItem("username", username);

        window.location.href = "./login.html";

      } else {

        alert("Please fill in all fields.");

      }
    });
  </script>

</body>
</html>
