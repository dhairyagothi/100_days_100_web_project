<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renew - AaharShare</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f4;
            color: #333;
        }

        header {
            background: #1b7d2b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 {
            color: #1b7d2b;
            margin-bottom: 20px;
        }

        p {
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #1b7d2b;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #146322;
        }
    </style>
</head>
<body>

<header>
    <h1>AaharShare</h1>
</header>

<div class="container">
    <h2>Renew Your Commitment</h2>

    <p>
        Thank you for supporting AaharShare. Your continued participation
        helps reduce food waste and provide meals to those in need.
    </p>

    <p>
        Click the button below to renew your volunteer or donor commitment
        and continue making a positive impact.
    </p>

    <a href="index.html" class="btn">Back to Home</a>
</div>

</body>
</html>
