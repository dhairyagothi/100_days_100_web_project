<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renew Membership</title>

    <link rel="stylesheet" href="style.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#0d6b23;
        }

        .container{
            width:90%;
            max-width:700px;
            margin:50px auto;
            background:#fff;
            border-radius:15px;
            padding:35px;
            box-shadow:0 8px 25px rgba(0,0,0,.2);
        }

        h1{
            text-align:center;
            color:#0d6b23;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        .back{
            display:inline-block;
            margin-bottom:25px;
            color:#0d6b23;
            text-decoration:none;
            font-weight:bold;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        textarea{
            resize:vertical;
        }

        button{
            width:100%;
            padding:14px;
            background:#0d6b23;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#0b571d;
        }

        .info-box{
            margin-top:25px;
            background:#eaf8ec;
            border-left:5px solid #0d6b23;
            padding:15px;
            border-radius:8px;
        }

        @media(max-width:600px){

            .container{
                margin:20px;
                padding:20px;
            }

            h1{
                font-size:28px;
            }
        }
    </style>

</head>
<body>

<div class="container">

    <a href="index.html" class="back">← Back to Home</a>

    <h1>Renew Membership</h1>

    <p>
        Renew your NGO or donor membership to continue receiving updates,
        donation opportunities, and community support.
    </p>

    <form>

        <div class="form-group">
            <label>Organization / Donor Name</label>
            <input type="text" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
            <label>Membership ID</label>
            <input type="text" placeholder="Enter Membership ID">
        </div>

        <div class="form-group">
            <label>Renewal Plan</label>

            <select required>
                <option>Select Plan</option>
                <option>Monthly</option>
                <option>Quarterly</option>
                <option>Yearly</option>
            </select>
        </div>

        <div class="form-group">
            <label>Comments</label>

            <textarea rows="4" placeholder="Any message..."></textarea>
        </div>

        <button type="submit">
            Renew Membership
        </button>

    </form>

    <div class="info-box">
        <strong>Why Renew?</strong>
        <p style="margin-top:10px;">
            ✔ Continue making an impact through donations.<br>
            ✔ Stay connected with NGOs and volunteers.<br>
            ✔ Receive priority updates and support.
        </p>
    </div>

</div>

</body>
</html>
