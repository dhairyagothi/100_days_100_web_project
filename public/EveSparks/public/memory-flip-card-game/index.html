<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Flip Card Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>🃏 Memory Flip Card Game</h1>
            <div class="header-toolbar">
                <div class="stats">
                    <span class="badge badge-purple">Moves: <span id="moves">0</span></span>
                    <span class="badge badge-purple">Pairs: <span id="pairs">0</span></span>
                    <span class="badge badge-purple">Time: <span id="time">60</span></span>
                    <span class="badge badge-purple">Best: <span id="best-score">-</span></span>
                </div>
                <div class="actions">
                    <button id="restart-btn" class="btn btn-teal">Restart</button>
                    <button id="reset-btn" class="btn btn-teal">Hard Reset</button>
                </div>
            </div>
        </header>

        <main class="board-container">
            <div id="game-board" class="game-board">
                <!-- Cards generated by JS -->
            </div>
            <div id="game-message" class="game-message hidden">
                <h2 id="message-title">Game Over</h2>
                <p id="message-desc"></p>
                <button id="play-again-btn" class="btn play-again">Play Again</button>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
