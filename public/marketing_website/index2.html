<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Sign Up</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" href="../favv.png" type="image/x-icon" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">

    <style>
        body {
          background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('market.jpg');
          background-repeat: no-repeat;
          background-position: center;
          background-size: cover;
          background-attachment: fixed;
          font-family: 'Open Sans', sans-serif;
          background-color: #f4f7f6;
        }

        main {
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          padding: 20px;
        }

        .signup {
          background-color: #ffffff;
          padding: 40px; 
          border-radius: 12px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
          max-width: 450px; 
          width: 100%;
        }

        .signup h2 {
          text-align: center;
          margin-bottom: 30px;
          color: #333;
          font-weight: 700;
        }

        .signup form {
          display: flex;
          flex-direction: column;
        }

        .signup label {
          margin-bottom: 8px;
          font-weight: 600;
          color: #555;
        }

        .signup input {
          padding: 12px;
          margin-bottom: 15px;
          border: 1px solid #ddd;
          border-radius: 6px;
          transition: border-color 0.3s ease;
        }
        
        .signup input:focus {
          border-color: #007bff;
          outline: none;
          box-shadow: 0 0 5px rgba(0, 123, 255, 0.2);
        }

        .signup button {
          padding: 12px 20px;
          border: none;
          border-radius: 6px;
          background: #007bff;
          color: #fff;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.3s ease;
          margin-top: 10px;
        }

        .signup button:hover {
          background: #0056b3;
          transform: translateY(-2px);
          box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
        }

        .password-info {
          font-size: 12px;
          color: #888;
          margin-top: -10px;
          margin-bottom: 15px;
        }

        .signup > p {
          text-align: center;
          margin: 20px 0;
          color: #777;
          font-size: 0.9rem;
        }

        .social-buttons {
          display: flex;
          gap: 10px;
        }

        .social-buttons a,
        .social-buttons button {
          flex: 1;
          padding: 10px;
          border: none;
          border-radius: 6px;
          background: #db4437; /* Google Red */
          color: #fff;
          cursor: pointer;
          text-align: center;
          text-decoration: none;
          transition: all 0.3s ease;
          font-size: 0.9rem;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
        }

        .social-buttons button {
          background: #4267B2; /* Facebook Blue */
        }

        .social-buttons a:hover {
          background: #c23321;
          transform: translateY(-2px);
        }
        
        .social-buttons button:hover {
          background: #365899;
          transform: translateY(-2px);
        }

        #success {
          color: #28a745;
          font-size: 14px;
          text-align: center;
          margin-top: 15px;
          font-weight: 600;
        }

        .back-link {
          display: block;
          text-align: center;
          margin-top: 25px;
        }
        
        .back-link a {
          color: #666;
          text-decoration: none;
          transition: color 0.3s ease;
        }

        .back-link a:hover {
          color: #007bff;
        }

        @media (max-width: 480px) {
          .social-buttons {
            flex-direction: column;
          }
          .signup {
            padding: 30px 20px;
          }
        }
    </style>
</head>

<body>
  <main>
    <section class="signup">
      <h2>Sign Up</h2>
      <form name="submit-to-google-sheet">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your full name">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="name@email.com">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="Create password">
        <p class="password-info">Between 8 and 72 characters</p>
        <button type="submit">submit</button>
        <span id="success"></span>
      </form>
      <p>or</p>
      <div class="social-buttons">
        <a href="#"><i class="fab fa-google"></i> Continue with Google</a>
        <button><i class="fab fa-facebook"></i> Continue with Facebook</button>
      </div>
      <div class="back-link">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Homepage</a>
      </div>
    </section>
    </main>

  <!-- JavaScript for form submission -->
  <script>
    const scriptURL = 'put the url';  // Change this URL to point to the desired endpoint
    const form = document.forms['submit-to-google-sheet'];
    const success = document.getElementById("success");

    form.addEventListener('submit', e => {
      e.preventDefault();
      fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => {
          success.innerHTML = "Data successfully submitted";
          setTimeout(() => success.innerHTML = "", 7000);
          form.reset();
        })
        .catch(error => console.error('Error!', error.message));
    });
  </script>
</body>
</html>
