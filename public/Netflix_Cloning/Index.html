<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix - Watch TV Shows Online, Watch Movies Online</title>
    <!-- Favicon link pointing to official brand Netflix Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23E50914'%3E%3Cpath d='M5.01 22V2h3.98l6 14.8V2h4.01v20h-3.98l-6-14.8V22H5.01z'/%3E%3C/svg%3E" />
    
    <!-- External Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Play CDN for instantaneous class compilation without build overhead -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'netflix': {
                'red': '#E50914',
                'black': '#141414',
                'gray': '#181818',
                'dark-gray': '#0c0c0c',
                'border': '#2b2b2b'
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              display: ['Space Grotesk', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace']
            }
          }
        }
      }
    </script>
    
    <!-- Theme specific rules from style.css (relative path - works when files are in same folder) -->
    <link rel="stylesheet" href="style.css" />
    
    <!-- Lucide icons CDN for rendering native beautiful svg visuals on demand -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-[#141414] text-white overflow-x-hidden min-h-screen">
    <!-- Active Mount Root for dynamic profile selection and browser state machine -->
    <div id="root" class="min-h-screen w-full flex flex-col justify-between"></div>
    
    <!-- Unified modular vanilla JavaScript logic (no type=module so it runs without a server) -->
    <script src="script.js"></script>
  </body>
</html>
