<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interview Simulator</title>
  <link rel="stylesheet" href="/public/InterviewSimulator/style.css">
</head>
<body>

  <div class="container">

    <div class="top-bar" id="main-top-bar">
      <h1>INTERVIEW SIMULATOR</h1>

      <div class="stats">
        <div class="card">
          <span>Question</span>
          <h2 id="question-count">1/5</h2>
        </div>

        <div class="card">
          <span>Stress Level</span>
          <h2 id="stress-level">0%</h2>
        </div>

        <div class="card">
          <span>Timer</span>
          <h2 id="timer">30</h2>
        </div>
      </div>
    </div>

    <div class="interview-box" id="interview-box">

      <div class="interviewer">
        <div class="avatar"></div>

        <div class="dialogue">
          <h3>AI Interviewer</h3>
          <p id="question">
            Loading question...
          </p>
        </div>
      </div>

      <textarea 
        id="answer"
        placeholder="Type your answer here..."
      ></textarea>

      <div class="buttons">
        <button id="next-btn">Next Question</button>
        <button id="restart-btn">Restart</button>
      </div>

    </div>

    <div id="results-container" class="hidden">
      <div class="top-bar">
        <h1>INTERVIEW RESULTS</h1>
      </div>

      <div class="stats results-stats">
        <div class="card">
          <span>Attempted</span>
          <h2 id="results-attempted">0/5</h2>
        </div>
        <div class="card">
          <span>Accuracy</span>
          <h2 id="results-accuracy">0%</h2>
        </div>
        <div class="card">
          <span>Correct / Detailed</span>
          <h2 id="results-correct" style="color: #2ea043;">0</h2>
        </div>
        <div class="card">
          <span>Incorrect / Weak</span>
          <h2 id="results-incorrect" style="color: #f85149;">0</h2>
        </div>
        <div class="card">
          <span>Avg Time / Q</span>
          <h2 id="results-avg-time">0s</h2>
        </div>
      </div>

      <div class="interview-box results-box">
        <h2 class="section-title">Performance Breakdown</h2>
        <div id="questions-breakdown" class="breakdown-list">
          <!-- Dynamically populated question cards -->
        </div>

        <h2 class="section-title" style="margin-top: 30px;">Feedback & Recommendations</h2>
        <div class="feedback-card">
          <p id="feedback-summary">Generating feedback...</p>
          <ul id="suggestions-list" class="suggestions-list">
            <!-- Dynamically populated suggestions -->
          </ul>
        </div>

        <div class="buttons" style="margin-top: 25px;">
          <button id="results-restart-btn">Restart Interview</button>
        </div>
      </div>
    </div>

  </div>

  <script src="/public/InterviewSimulator/app.js"></script>
</body>
</html>
