<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            background: none;
            display: block;
            margin: 0 auto;
            cursor: pointer;
            border: 1px solid blue;
        }
    </style>
    <title>Firecracker Animation</title>
  <style>
.back-home-btn {
  position: fixed;
  top: 16px;
  right: 16px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  color: inherit;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid currentColor;
  border-radius: 999px;
  text-decoration: none;
  font: inherit;
  font-weight: 600;
  line-height: 1;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  z-index: 9999;
}

.back-home-btn:hover {
  transform: translateY(-2px);
  background: rgba(255, 255, 255, 0.22);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.24);
}
</style>
</head>
<body>
  <a href="../../index.html" class="back-home-btn"> ← Back to Home </a>
    <canvas id="firecrackerCanvas" width="1400" height="650">


        
    </canvas>

    <script>
        const canvas = document.getElementById("firecrackerCanvas");
        const ctx = canvas.getContext("2d");

        const particles = [];

        canvas.addEventListener("click", launchFirecracker);

        function launchFirecracker(event) {
            const x = event.clientX - canvas.getBoundingClientRect().left;
            const y = event.clientY - canvas.getBoundingClientRect().top;

            explode(x, y);
        }

        function explode(x, y) {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];

            for (let i = 0; i < 100; i++) {
                const particle = {
                    x: x,
                    y: y,
                    size: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 6,
                    speedY: (Math.random() - 0.5) * 6,
                    color: colors[Math.floor(Math.random() * colors.length)]
                };

                particles.push(particle);
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                const particle = particles[i];

                particle.x += particle.speedX;
                particle.y += particle.speedY;
                particle.size *= 0.95;

                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();

                if (particle.size <= 0.5) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
