<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoPulse - Live Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <div class="logo-area">
                <h1><i class="fa-solid fa-chart-line-up"></i> CryptoPulse</h1>
                <span class="live-indicator"><span class="pulse-dot"></span> Live Data</span>
            </div>
            <div class="control-panel">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search by name or symbol...">
                </div>
                <button id="refreshBtn" class="btn"><i class="fa-solid fa-rotate"></i> Refresh</button>
            </div>
        </header>

        <main id="cryptoGrid" class="crypto-grid">
            </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
