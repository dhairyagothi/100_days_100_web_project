
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Palindrome Checker | GSSoC '26</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="/public/Palindrome_Generator/style.css">
</head>

<body>

    <div class="main-container">

        <div class="glass-card p-4 p-md-5">

            <h1 class="text-center mb-2">
                Palindrome Checker
            </h1>

            <p class="text-center text-light-50 mb-4">
                Enter a word or number and check if it is a palindrome ✨
            </p>

            <!-- Input -->
            <div class="input-section">

                <label for="inputString" class="form-label text-white">
                    Enter your text:
                </label>

                <input
                    type="text"
                    id="inputString"
                    class="form-control custom-input"
                    placeholder="Type something..."
                    autocomplete="off"
                />

            </div>

            <!-- Buttons -->
            <div class="d-grid gap-2 mt-4">

                <button id="checkBtn" class="btn btn-primary-custom">
                    Check Palindrome 🚀
                </button>

                <button id="clearBtn"
                    class="btn btn-link text-white-50 btn-sm text-decoration-none">
                    Clear
                </button>

            </div>

            <!-- Result -->
            <div id="resultBox" class="result-container mt-4 text-center">

                <div id="resultIcon" class="mb-2 fs-1">
                    ⌨️
                </div>

                <div id="resultText">
                    Waiting for you to click check...
                </div>

            </div>

        </div>

    </div>

    <!-- JS -->
    <script src="/public/Palindrome_Generator/script.js"></script>

</body>
</html>
