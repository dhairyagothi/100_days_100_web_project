<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="icon" href="../../favv.png" type="image/x-icon" />
  <style>
.back-home-btn {
  position: fixed;
  top: 16px;
  right: 16px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  color: inherit;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid currentColor;
  border-radius: 999px;
  text-decoration: none;
  font: inherit;
  font-weight: 600;
  line-height: 1;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  z-index: 9999;
}

.back-home-btn:hover {
  transform: translateY(-2px);
  background: rgba(255, 255, 255, 0.22);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.24);
}
</style>
</head>

<body class="bg-gray-100">
  <a href="../../index.html" class="back-home-btn"> ← Back to Home </a>
    <div class="container mx-auto py-8">
        <h1 class="text-4xl font-bold text-center mb-8">Sign Up</h1>
        <form action="/signup" method="post" class="max-w-md mx-auto">
            <input type="text" name="name" placeholder="Name" class="border border-gray-300 rounded-md px-3 py-2 mb-4 block w-full">
            <input type="email" name="email" placeholder="Email" class="border border-gray-300 rounded-md px-3 py-2 mb-4 block w-full">
            <input type="password" name="password" placeholder="Password" class="border border-gray-300 rounded-md px-3 py-2 mb-4 block w-full">
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Sign Up</button>
        </form>
    </div>
</body>

</html>
