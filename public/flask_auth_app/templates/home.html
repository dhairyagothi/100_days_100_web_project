<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="icon" href="../../favv.png" type="image/x-icon" />
  <style>
.back-home-btn {
  position: fixed;
  top: 16px;
  right: 16px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  color: inherit;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid currentColor;
  border-radius: 999px;
  text-decoration: none;
  font: inherit;
  font-weight: 600;
  line-height: 1;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  z-index: 9999;
}

.back-home-btn:hover {
  transform: translateY(-2px);
  background: rgba(255, 255, 255, 0.22);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.24);
}
</style>
</head>

<body class="h-screen bg-gray-100">
  <a href="../../index.html" class="back-home-btn"> ← Back to Home </a>
    <div class="container mx-auto py-8">
        <h1 class="text-4xl font-bold text-center mb-8">Welcome to Your App</h1>
        {% if current_user %}
        <div class="text-center flex flex-col items-center gap-5">
            <p class="text-3xl">Logged in as {{ current_user.name }}</p>
            <a href="/protected"
               class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded text-2xl">Go to Protected Page</a>
            <form action="/logout" method="post">
                <button type="submit" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded text-2xl">Sign Out</button>
            </form>
        </div>
        {% else %}
        <div class="text-center flex flex-col items-center gap-5">
            <a href="/signup"
               class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded text-2xl">Sign Up</a>
            <a href="/login"
               class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded text-2xl">Log In</a>
        </div>
        {% endif %}
    </div>
</body>

</html>
