<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protected Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link rel="icon" href="../../favv.png" type="image/x-icon" />
    <style>
.back-home-btn {
  position: fixed;
  top: 16px;
  right: 16px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  color: inherit;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid currentColor;
  border-radius: 999px;
  text-decoration: none;
  font: inherit;
  font-weight: 600;
  line-height: 1;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  z-index: 9999;
}

.back-home-btn:hover {
  transform: translateY(-2px);
  background: rgba(255, 255, 255, 0.22);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.24);
}
</style>
</head>

  <body class="bg-gray-100">
  <a href="../../index.html" class="back-home-btn"> ← Back to Home </a>
    <div class="container mx-auto py-8">
      <a href="/" class="text-2xl font-bold p-4 bg-blue-500 text-white rounded-xl">Home</a>
      <h1 class="text-4xl font-bold underline text-center mb-8">Protected Page</h1>
      <p class="mb-4 text-2xl">Welcome, {{ current_user.name }}!</p>
      <h2 class="text-3xl font-bold mb-4">Users List:</h2>
      <ul class="divide-y divide-gray-200">
        {% for user in users %}
          <li class="py-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center">
                <span class="font-medium text-lg text-gray-900">{{ user.name }}</span>
                <span class="ml-2 text-lg text-gray-500">{{ user.email }}</span>
              </div>
            </div>
          </li>
        {% endfor %}
      </ul>
    </div>
  </body>
</html>
