<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TaskFlow To-Do App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="todolist.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

  <nav class="navbar">

    <div class="nav-brand">
      <span class="brand-dot"></span>
      <span class="brand-name">TASKFLOW</span>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active"
        id="btn-home"
        onclick="showHome()">
        Home
      </button>

      <button class="tab-btn"
        id="btn-docs"
        onclick="showDocuments()">
        Documents
      </button>
    </div>

    <div class="nav-themes">

      <span class="theme-label">THEME</span>

      <button class="theme-swatch"
        id="t1"
        onclick="applyTheme('sunset')">
      </button>

      <button class="theme-swatch"
        id="t2"
        onclick="applyTheme('ocean')">
      </button>

      <button class="theme-swatch"
        id="t3"
        onclick="applyTheme('forest')">
      </button>

      <button class="theme-swatch"
        id="t4"
        onclick="applyTheme('midnight')">
      </button>

      <button class="theme-swatch"
        id="t5"
        onclick="applyTheme('aurora')">
      </button>

    </div>

  </nav>

  <main>

    <section id="home-tab">

      <header class="page-header">

        <h1 class="main-heading">
          JUST DO IT.
        </h1>

        <p class="sub-heading">
          Track what matters. Crush what's next.
        </p>

      </header>

      <div class="add-task-bar">

        <div class="input-row">

          <input
            type="text"
            id="task-input"
            placeholder="What needs to be done?"
            autocomplete="off"
          >

          <select id="task-type-select">

            <option value="" data-color="#ffffff">
              Category
            </option>

            <option value="Work" data-color="#FFDE59">
              💼 Work
            </option>

            <option value="Personal" data-color="#FFC0CB">
              🌸 Personal
            </option>

            <option value="Urgent" data-color="#FF6B6B">
              🔥 Urgent
            </option>

            <option value="Fitness" data-color="#B1EE99">
              💪 Fitness
            </option>

            <option value="Misc" data-color="#CAB9F5">
              ✨ Misc
            </option>

          </select>

          <button class="btn-add"
            onclick="addTask()">
            + Add Task
          </button>

        </div>

      </div>

      <div class="stats-bar">

        <div class="stat">
          <span class="stat-num" id="stat-total">0</span>
          <span class="stat-lbl">Total</span>
        </div>

        <div class="stat-divider"></div>

        <div class="stat">
          <span class="stat-num" id="stat-done">0</span>
          <span class="stat-lbl">Done</span>
        </div>

        <div class="stat-divider"></div>

        <div class="stat">
          <span class="stat-num" id="stat-pending">0</span>
          <span class="stat-lbl">Pending</span>
        </div>

        <div class="progress-wrap">

          <div class="progress-bar">
            <div class="progress-fill"
              id="progress-fill">
            </div>
          </div>

          <span class="progress-pct"
            id="progress-pct">
            0%
          </span>

        </div>

      </div>

      <div class="filter-bar">

        <button class="filter-btn active"
          onclick="filterTasks(this, 'all')">
          All
        </button>

        <button class="filter-btn"
          onclick="filterTasks(this, 'pending')">
          Pending
        </button>

        <button class="filter-btn"
          onclick="filterTasks(this, 'done')">
          Done
        </button>

        <button class="filter-btn"
          onclick="filterTasks(this, 'Work')">
          💼 Work
        </button>

        <button class="filter-btn"
          onclick="filterTasks(this, 'Personal')">
          🌸 Personal
        </button>

        <button class="filter-btn"
          onclick="filterTasks(this, 'Urgent')">
          🔥 Urgent
        </button>

        <button class="filter-btn"
          onclick="filterTasks(this, 'Fitness')">
          💪 Fitness
        </button>

        <button class="filter-btn"
          onclick="filterTasks(this, 'Misc')">
          ✨ Misc
        </button>

        <button class="btn-clear-done"
          onclick="clearDone()">
          Clear Done
        </button>

      </div>

      <div id="task-list">

        <div class="empty-state">

          <div class="empty-icon">
            📋
          </div>

          <p>
            No tasks yet. Add one above!
          </p>

        </div>

      </div>

      <div class="action-row">

        <button class="btn-pdf"
          onclick="saveAsPDF()">
          Save as PDF
        </button>

      </div>

    </section>

    <section id="documents-tab"
      style="display:none">

      <header class="page-header">

        <h1 class="main-heading">
          SAVED DOCS.
        </h1>

        <p class="sub-heading">
          Your exported task lists live here.
        </p>

      </header>

      <div class="documents-list"
        id="documents-list">

        <div class="empty-state">

          <div class="empty-icon">
            🗂️
          </div>

          <p>
            No documents saved yet.
          </p>

        </div>

      </div>

    </section>

  </main>

  <div id="toast" class="toast"></div>

  <script src="todolist.js"></script>

</body>
</html>
