<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean, responsive To-Do List app with theme switching and PDF export — part of the 100 Days 100 Projects challenge." />
  <title>To-Do List | 100 Days 100 Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://kit.fontawesome.com/f30fac2c61.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="todolist.css" />
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-brand">
      <span class="brand-dot"></span>
      <span class="brand-name">TaskFlow</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="btn-home" onclick="showHome()">Home</button>
      <button class="tab-btn" id="btn-docs" onclick="showDocuments()">Documents</button>
    </div>
    <div class="nav-themes">
      <span class="theme-label">THEME</span>
      <button class="theme-swatch" id="t1" onclick="applyTheme('sunset')" title="Sunset"></button>
      <button class="theme-swatch" id="t2" onclick="applyTheme('ocean')" title="Ocean"></button>
      <button class="theme-swatch" id="t3" onclick="applyTheme('forest')" title="Forest"></button>
      <button class="theme-swatch" id="t4" onclick="applyTheme('midnight')" title="Midnight"></button>
      <button class="theme-swatch" id="t5" onclick="applyTheme('aurora')" title="Aurora"></button>
    </div>
  </nav>

  <!-- MAIN -->
  <main>

    <!-- HOME TAB -->
    <section id="home-tab">
      <header class="page-header">
        <h1 class="main-heading">JUST DO IT.</h1>
        <p class="sub-heading">Track what matters. Crush what's next.</p>
      </header>

      <!-- ADD TASK BAR -->
      <div class="add-task-bar">
        <div class="input-row">
          <input type="text" id="task-input" placeholder="What needs to be done?" autocomplete="off" />
          <select id="task-type">
            <option value="">Select Type</option>
            <option value="Work" data-color="#FFDE59">💼 Work</option>
            <option value="Personal" data-color="#FFC0CB">🌸 Personal</option>
            <option value="Professional" data-color="#B0BEC5">📋 Professional</option>
            <option value="Fitness" data-color="#B1EE99">💪 Fitness</option>
            <option value="Miscellaneous" data-color="#CAB9F5">✨ Misc</option>
          </select>
          <button class="btn-add" onclick="Add()">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            Add Task
          </button>
        </div>
      </div>

      <!-- TASK LIST CONTAINER -->
      <div id="notes-container"></div>

      <!-- SAVE PDF BUTTON -->
      <div class="action-row">
        <button class="btn-pdf" onclick="saveAsPDF()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14,2 14,8 20,8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <line x1="9" y1="15" x2="15" y2="15"/>
          </svg>
          Save as PDF
        </button>
      </div>
    </section>

    <!-- DOCUMENTS TAB -->
    <section id="documents-tab" style="display:none">
      <header class="page-header">
        <h1 class="main-heading">SAVED<br>DOCS.</h1>
        <p class="sub-heading">Your exported task lists live here.</p>
      </header>
      <div class="documents-container">
        <div class="documents-list" id="documents-list">
          <div class="empty-state">
            <div class="empty-icon">🗂️</div>
            <p>No documents saved yet. Export your tasks!</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>
  <div id="pdfMessage" class="pdf-message">
    <i class="fa-solid fa-check-circle"></i> PDF Created Successfully!
  </div>

  <script src="todolist.js"></script>
</body>

</html>
