<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TaskFlow — Advanced Todo App</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="todolist.css">
</head>

<body class="theme-sunset">

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar">

    <div class="nav-brand">
      <span class="brand-dot"></span>
      <span class="brand-name">TASKFLOW</span>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" id="btn-home" onclick="showHome()">
        Home
      </button>

      <button class="tab-btn" id="btn-docs" onclick="showDocuments()">
        Documents
      </button>
    </div>

    <div class="nav-themes">

      <span class="theme-label">THEME</span>

      <button
        class="theme-swatch active"
        id="t1"
        onclick="applyTheme('sunset')"
        title="Sunset">
      </button>

      <button
        class="theme-swatch"
        id="t2"
        onclick="applyTheme('ocean')"
        title="Ocean">
      </button>

      <button
        class="theme-swatch"
        id="t3"
        onclick="applyTheme('forest')"
        title="Forest">
      </button>

      <button
        class="theme-swatch"
        id="t4"
        onclick="applyTheme('midnight')"
        title="Midnight">
      </button>

      <button
        class="theme-swatch"
        id="t5"
        onclick="applyTheme('aurora')"
        title="Aurora">
      </button>

    </div>

  </nav>

  <!-- ================= MAIN ================= -->
  <main>

    <!-- ================= HOME TAB ================= -->
    <section id="home-tab">

      <header class="page-header">

        <h1 class="main-heading">
          JUST DO IT.
        </h1>

        <p class="sub-heading">
          Track what matters. Crush what's next.
        </p>

      </header>

      <!-- ================= ADD TASK ================= -->
      <div class="add-task-bar">

        <div class="input-row">

          <input
            type="text"
            id="task-input"
            placeholder="What needs to be done?"
            autocomplete="off"
          >

          <select id="task-type-select">

            <option value="">Category</option>

            <option value="Work">💼 Work</option>

            <option value="Personal">🌸 Personal</option>

            <option value="Urgent">🔥 Urgent</option>

            <option value="Fitness">💪 Fitness</option>

            <option value="Misc">✨ Misc</option>

          </select>

          <button class="btn-add" onclick="addTask()">

            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path
                d="M8 1v14M1 8h14"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
              />
            </svg>

            Add Task

          </button>

        </div>

      </div>

      <!-- ================= STATS ================= -->
      <div class="stats-bar">

        <div class="stat">
          <span class="stat-num" id="stat-total">0</span>
          <span class="stat-lbl">Total</span>
        </div>

        <div class="stat-divider"></div>

        <div class="stat">
          <span class="stat-num" id="stat-done">0</span>
          <span class="stat-lbl">Done</span>
        </div>

        <div class="stat-divider"></div>

        <div class="stat">
          <span class="stat-num" id="stat-pending">0</span>
          <span class="stat-lbl">Pending</span>
        </div>

        <div class="progress-wrap">

          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>

          <span class="progress-pct" id="progress-pct">
            0%
          </span>

        </div>

      </div>

      <!-- ================= FILTERS ================= -->
      <div class="filter-bar">

        <button
          class="filter-btn active"
          onclick="filterTasks(this, 'all')">
          All
        </button>

        <button
          class="filter-btn"
          onclick="filterTasks(this, 'pending')">
          Pending
        </button>

        <button
          class="filter-btn"
          onclick="filterTasks(this, 'done')">
          Done
        </button>

        <button
          class="filter-btn"
          onclick="filterTasks(this, 'Work')">
          💼 Work
        </button>

        <button
          class="filter-btn"
          onclick="filterTasks(this, 'Personal')">
          🌸 Personal
        </button>

        <button
          class="filter-btn"
          onclick="filterTasks(this, 'Urgent')">
          🔥 Urgent
        </button>

        <button
          class="filter-btn"
          onclick="filterTasks(this, 'Fitness')">
          💪 Fitness
        </button>

        <button
          class="filter-btn"
          onclick="filterTasks(this, 'Misc')">
          ✨ Misc
        </button>

        <button
          class="btn-clear-done"
          onclick="clearDone()">
          Clear Done
        </button>

      </div>

      <!-- ================= TASK LIST ================= -->
      <div id="task-list">

        <div class="empty-state" id="empty-state">

          <div class="empty-icon">
            📋
          </div>

          <p>
            No tasks yet. Add one above!
          </p>

        </div>

      </div>

      <!-- ================= ACTIONS ================= -->
      <div class="action-row">

        <button class="btn-pdf" onclick="saveAsPDF()">

          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>

            <polyline points="14,2 14,8 20,8"></polyline>

            <line x1="12" y1="18" x2="12" y2="12"></line>

            <line x1="9" y1="15" x2="15" y2="15"></line>

          </svg>

          Save as PDF

        </button>

      </div>

    </section>

    <!-- ================= DOCUMENTS TAB ================= -->
    <section id="documents-tab" style="display:none">

      <header class="page-header">

        <h1 class="main-heading">
          SAVED<br>DOCS.
        </h1>

        <p class="sub-heading">
          Your exported task lists live here.
        </p>

      </header>

      <div class="documents-list" id="documents-list">

        <div class="empty-state">

          <div class="empty-icon">
            🗂️
          </div>

          <p>
            No documents saved yet. Export your tasks!
          </p>

        </div>

      </div>

    </section>

  </main>

  <!-- ================= TOAST ================= -->
  <div id="toast" class="toast"></div>

  <!-- ================= JS ================= -->
  <script src="todolist.js"></script>

</body>
</html>
