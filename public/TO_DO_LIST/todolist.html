<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>TaskFlow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <script
    src="https://kit.fontawesome.com/f30fac2c61.js"
    crossorigin="anonymous"
  ></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <link rel="stylesheet" href="todolist.css"/>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="nav-brand">
      <span class="brand-dot"></span>
      <span class="brand-name">TaskFlow</span>
    </div>

    <div class="nav-tabs">

      <button
        class="tab-btn active"
        id="home-btn"
        onclick="showHome()"
      >
        Home
      </button>

      <button
        class="tab-btn"
        id="docs-btn"
        onclick="showDocuments()"
      >
        Documents
      </button>

    </div>

    <div class="nav-themes">

      <button class="theme-swatch default"
        onclick="applyTheme('default')"></button>

      <button class="theme-swatch ocean"
        onclick="applyTheme('ocean')"></button>

      <button class="theme-swatch forest"
        onclick="applyTheme('forest')"></button>

      <button class="theme-swatch midnight"
        onclick="applyTheme('midnight')"></button>

    </div>

  </nav>

  <main>

    <!-- HOME -->
    <section id="home-tab">

      <header class="page-header">

        <h1 class="main-heading">
          JUST DO IT.
        </h1>

        <p class="sub-heading">
          Track what matters.
        </p>

      </header>

      <!-- INPUT -->
      <div class="add-task-bar">

        <div class="input-row">

          <input
            type="text"
            id="task-input"
            placeholder="What needs to be done?"
          />

          <select id="task-type">

            <option value="">Category</option>

            <option value="Work">💼 Work</option>
            <option value="Personal">🌸 Personal</option>
            <option value="Urgent">🔥 Urgent</option>
            <option value="Fitness">💪 Fitness</option>

          </select>

          <button class="btn-add" onclick="addTask()">

            <i class="fa-solid fa-plus"></i>

            Add

          </button>

        </div>

      </div>

      <!-- STATS -->
      <div class="stats-bar">

        <div class="stat">
          <span class="stat-num" id="total-tasks">0</span>
          <span class="stat-lbl">TOTAL</span>
        </div>

        <div class="stat">
          <span class="stat-num" id="done-tasks">0</span>
          <span class="stat-lbl">DONE</span>
        </div>

        <div class="stat">
          <span class="stat-num" id="pending-tasks">0</span>
          <span class="stat-lbl">PENDING</span>
        </div>

      </div>

      <!-- FILTER -->
      <div class="filter-bar">

        <button class="filter-btn active"
          onclick="filterTasks('all', this)">
          All
        </button>

        <button class="filter-btn"
          onclick="filterTasks('pending', this)">
          Pending
        </button>

        <button class="filter-btn"
          onclick="filterTasks('done', this)">
          Done
        </button>

      </div>

      <!-- TASK LIST -->
      <div id="task-list">

        <div class="empty-state" id="empty-state">

          <div class="empty-icon">📋</div>

          <p>No tasks yet.</p>

        </div>

      </div>

      <!-- PDF -->
      <div class="action-row">

        <button class="btn-pdf" onclick="saveAsPDF()">

          <i class="fa-solid fa-file-pdf"></i>

          Save PDF

        </button>

      </div>

    </section>

    <!-- DOCUMENTS -->
    <section id="documents-tab" style="display:none;">

      <header class="page-header">

        <h1 class="main-heading">
          DOCS.
        </h1>

        <p class="sub-heading">
          Exported PDFs.
        </p>

      </header>

      <div class="documents-list" id="documents-list">

        <div class="empty-state">
          <div class="empty-icon">🗂️</div>
          <p>No documents yet.</p>
        </div>

      </div>

    </section>

  </main>

  <script src="todolist.js"></script>

</body>
</html>
