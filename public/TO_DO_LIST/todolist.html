<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow | Premium To-Do Experience</title>
    <link rel="stylesheet" href="todolist.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-left">
        <a href="#" onclick="showHome()"><i class="fas fa-home"></i> <span>Home</span></a>
        <a href="#" onclick="showDocuments()"><i class="fas fa-file-pdf"></i> <span>Documents</span></a>
      </div>
      <div class="nav-brand" style="font-weight: 800; font-size: 1.2rem; color: var(--accent-cyan); letter-spacing: 1px;">
        TASKFLOW
      </div>
      <div class="nav-right">
        <button id="colour1" onclick="c1()" title="Rose Theme"></button>
        <button id="colour2" onclick="c2()" title="Sky Theme"></button>
        <button id="colour3" onclick="c3()" title="Amber Theme"></button>
        <button id="colour4" onclick="c4()" title="Emerald Theme"></button>
        <button id="colour5" onclick="c5()" title="Purple Theme"></button>
      </div>
    </nav>

    <main class="main">
      <div id="home-tab">
        <div class="heading">Just Do It.</div>
        
        <div class="buttons">
          <button onclick="Add()" id="submittask">
            <i class="fas fa-plus-circle"></i> Add a task!
          </button>
          <button onclick="saveAsPDF()" id="savepdf">
            <i class="fas fa-download"></i> Save as PDF
          </button>
        </div>

        <div id="notes-container">
          <!-- Tasks will appear here -->
           <div class="empty-state">
             <i class="fas fa-clipboard-list"></i>
             <p>No tasks yet. Click 'Add a task!' to begin your journey.</p>
           </div>
        </div>
      </div>

      <div id="documents-tab" style="display: none">
        <div class="heading">Your Archives</div>
        <div class="documents-list">
          <!-- Saved PDFs will appear here -->
        </div>
      </div>
    </main>

    <div id="pdfMessage" class="pdf-message">
      <i class="fas fa-check-circle"></i> PDF Created Successfully!
    </div>

    <script src="todolist.js"></script>
  </body>
</html>
