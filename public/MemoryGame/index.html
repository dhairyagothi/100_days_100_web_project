<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Matching Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="../favv.png" type="image/x-icon" />
</head>
<body>

    <h1 id="game-title">Memory Matching Game</h1>
    <div class="instructions">
  <h3>How to Play</h3>
  <ul>
    <li>Flip two cards at a time.</li>
    <li>Match identical cards to score.</li>
    <li>Wrong pairs flip back.</li>
    <li>Match all cards to win.</li>
  </ul>
</div>
    <div id="game-container" class="grid"></div>
    <p id="score-board">Matches: 0</p>

    <script src="script.js"></script>
</body>
</html>
