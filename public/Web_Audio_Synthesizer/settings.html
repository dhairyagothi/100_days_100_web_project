<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Audio Synthesizer - Settings</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="settings-body">

    <nav class="navbar compact">
        <div class="nav-brand">
            <i class="fa-solid fa-waveform"></i>
            <span>SynthOsc Configuration</span>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="synth.html">Synthesizer</a>
            <a href="settings.html" class="active">Settings</a>
        </div>
    </nav>

    <div class="settings-container">
        <h1>Global Settings</h1>
        
        <div class="settings-card">
            <h2><i class="fa-solid fa-palette"></i> Visualizer Theme</h2>
            <p>Customize the color of the oscilloscope canvas.</p>
            
            <div class="color-options">
                <button class="color-btn active" data-color="#0ea5e9" style="background-color: #0ea5e9;"></button>
                <button class="color-btn" data-color="#22c55e" style="background-color: #22c55e;"></button>
                <button class="color-btn" data-color="#eab308" style="background-color: #eab308;"></button>
                <button class="color-btn" data-color="#ef4444" style="background-color: #ef4444;"></button>
                <button class="color-btn" data-color="#a855f7" style="background-color: #a855f7;"></button>
            </div>
        </div>

        <div class="settings-card">
            <h2><i class="fa-solid fa-volume-high"></i> Audio Output</h2>
            <p>Master volume limit to prevent loud clipping.</p>
            
            <div class="range-group">
                <input type="range" id="vol-limit" min="0" max="1" step="0.1" value="1">
                <span id="vol-limit-val">1.0</span>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
    <script>
        // Settings page specific logic
        document.addEventListener('DOMContentLoaded', () => {
            const colorBtns = document.querySelectorAll('.color-btn');
            const storedColor = localStorage.getItem('synth_color') || '#0ea5e9';

            colorBtns.forEach(btn => {
                if (btn.dataset.color === storedColor) {
                    colorBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }

                btn.addEventListener('click', () => {
                    colorBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    localStorage.setItem('synth_color', btn.dataset.color);
                });
            });

            const volLimit = document.getElementById('vol-limit');
            const volLimitVal = document.getElementById('vol-limit-val');
            
            const storedLimit = localStorage.getItem('synth_vol_limit') || 1.0;
            volLimit.value = storedLimit;
            volLimitVal.innerText = parseFloat(storedLimit).toFixed(1);

            volLimit.addEventListener('input', (e) => {
                volLimitVal.innerText = parseFloat(e.target.value).toFixed(1);
                localStorage.setItem('synth_vol_limit', e.target.value);
            });
        });
    </script>
</body>
</html>
