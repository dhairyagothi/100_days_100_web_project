<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Social Media Icon</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

  <script src="https://kit.fontawesome.com/" crossorigin="anonymous"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <link rel="stylesheet" href="glow.css">
</head>

<body>

  <a href="https://100-days-100-web-project/" class="project-back-button"
    style="position:fixed;left:18px;top:18px;padding:8px 12px;border-radius:8px;background:linear-gradient(90deg, rgba(124,99,255,0.14), rgba(79,141,255,0.10));color:#fff;text-decoration:none;z-index:9999;font-weight:700;font-family:Inter, system-ui, sans-serif;box-shadow:0 8px 20px rgba(12,18,40,0.35);">
    ← Back to Home
  </a>

  <div class="icon-showcase">
  
    <!-- Hero Section -->
    <section class="hero">
    
      <h1 class="hero-title">
        Glowing Social Media Icons
      </h1>

      <p class="hero-text">
        Beautifully crafted glowing social media icons with smooth animations
      </p>
      <br>
  
    </section>

    <!-- Social Icons -->
    <div class="icons">

      <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
        <div class="layer">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span class="fab fa-facebook-f"></span>
        </div>
        <div class="text">Facebook</div>
      </a>

      <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">
        <div class="layer">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span class="fab fa-twitter"></span>
        </div>
        <div class="text">Twitter</div>
      </a>

      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
        <div class="layer">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span class="fab fa-instagram"></span>
        </div>
        <div class="text">Instagram</div>
      </a>

      <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
        <div class="layer">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span class="fab fa-linkedin-in"></span>
        </div>
        <div class="text">LinkedIn</div>
      </a>

      <a href="https://youtube.com" target="_blank" rel="noopener noreferrer">
        <div class="layer">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span class="fab fa-youtube"></span>
        </div>
        <div class="text">YouTube</div>
      </a>

    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>
        © 2026 Glowing Social Media Icons | Designed with ❤️
      </p>
    </footer>
  </div>

</body>

</html>
