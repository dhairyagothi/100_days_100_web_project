<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Glowing Social Media Icons</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="glow.css" />

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
</head>

<body>

  <div class="hero">
    <h1>Glow Connect</h1>
    <p>
      Modern glowing social media icons with immersive neon aesthetics
    </p>
  </div>

  <div class="icons">

    <a href="#">
      <div class="layer">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span class="fab fa-facebook-f"></span>
      </div>
      <div class="text">Facebook</div>
    </a>

    <a href="#">
      <div class="layer">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span class="fab fa-twitter"></span>
      </div>
      <div class="text">Twitter</div>
    </a>

    <a href="#">
      <div class="layer">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span class="fab fa-instagram"></span>
      </div>
      <div class="text">Instagram</div>
    </a>

    <a href="#">
      <div class="layer">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span class="fab fa-linkedin-in"></span>
      </div>
      <div class="text">LinkedIn</div>
    </a>

    <a href="#">
      <div class="layer">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span class="fab fa-youtube"></span>
      </div>
      <div class="text">YouTube</div>
    </a>

  </div>

</body>

</html>
