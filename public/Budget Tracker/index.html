<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <div class="main">

    <!-- HEADER -->
    <header class="header">
      <h1 class="main-heading">Expense Tracker</h1>

      <div class="mode-toggle">
        <input type="checkbox" class="mode" />
        <button id="resetBtn">Reset</button>
      </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="main-layout">

      <!-- ADD TRANSACTION -->
      <section class="add-data">
        <h3>Add Transaction</h3>

        <form class="add-transaction">
          <input type="number" id="amt" placeholder="Amount" required />
          <input type="text" id="desc" placeholder="Description" required />

          <select id="cat" required>
            <option value="">Select Category</option>
            <option value="food">Food</option>
            <option value="travel">Travel</option>
            <option value="shopping">Shopping</option>
            <option value="income">Income</option>
            <option value="other">Others</option>
          </select>

          <input type="date" id="date" required />
          <input type="submit" value="Add Transaction" />
          <button type="button" id="cancelEditBtn" class="cancel-edit" hidden>Cancel Edit</button>
        </form>
      </section>

      <!-- SUMMARY -->
      <section class="summary">

        <!-- ACCOUNT BALANCE -->
        <div class="acc-balance">
          <p class="label">Account Balance</p>
          <p class="amount" id="curramt">Rs.0</p>
        </div>

        <div class="summary-body">

          <!-- LEFT COLUMN -->
          <div class="summary-left">

            <!-- INCOME & EXPENSE -->
            <div class="income-expense">
              <div class="income">
                <p class="label">Total Income</p>
                <p class="amount" id="income">Rs.0</p>
              </div>

              <div class="expense">
                <p class="label">Total Expenses</p>
                <p class="amount" id="expense">Rs.0</p>
              </div>
            </div>

            <!-- MONTHLY BUDGET -->
            <div class="monthly-budget">
              <div class="budget-header">
                <p class="label">Monthly Budget</p>
                <input type="number" id="budgetInput" placeholder="Set Budget" />
              </div>

              <p class="amount" id="budget">Rs.0 / Rs.0</p>

              <div class="progress-bar">
                <div class="progress-fill"></div>
              </div>
            </div>
          </div>

          <!-- CATEGORY BREAKDOWN -->
          <div class="category-breakdown">
            <h3>Category Breakdown</h3>
            <p>Food <span data-cat="food">Rs.0</span></p>
            <p>Travel <span data-cat="travel">Rs.0</span></p>
            <p>Shopping <span data-cat="shopping">Rs.0</span></p>
            <p>Others <span data-cat="other">Rs.0</span></p>
          </div>

        </div>
      </section>
    </div>

    <!-- RECENT TRANSACTIONS -->
    <section class="recent-activity">
      <h3>Recent Transactions</h3>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="transaction-list"></tbody>
      </table>
    </section>

  </div>

</body>
</html>
