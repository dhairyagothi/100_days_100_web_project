<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BMI Fitness Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- LEFT -->
  <div class="left">

    <h1>💪 BMI Fitness Dashboard</h1>

    <!-- THEME BUTTONS -->
    <div class="theme-box">
      <p>🎨 Themes</p>

      <button onclick="setTheme('dark')">Dark</button>
      <button onclick="setTheme('light')">Light</button>
      <button onclick="setTheme('ocean')">Ocean</button>
      <button onclick="setTheme('sunset')">Sunset</button>
    </div>

    <div class="input-box">

      <input id="height" placeholder="Height (cm or 5/8)">
      <select id="heightUnit">
        <option value="cm">cm</option>
        <option value="ft">feet/inches</option>
      </select>

      <input id="weight" type="number" placeholder="Weight">
      <select id="weightUnit">
        <option value="kg">kg</option>
        <option value="lb">lb</option>
      </select>

      <button onclick="calculateBMI()">Calculate</button>

    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <h2>📊 Result</h2>
    <div id="result" class="result-box">
      Enter details to see report
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
