<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Terrain Generator</title>
  <meta name="description" content="A dynamic 3D Terrain Generator using Three.js and Perlin Noise.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui-container">
    <h1>3D Terrain Generator</h1>
    <div class="controls">
      <div class="control-group">
        <label for="speed">Flight Speed</label>
        <input type="range" id="speed" min="0" max="10" value="2" step="0.1">
      </div>
      <div class="control-group">
        <label for="roughness">Terrain Roughness</label>
        <input type="range" id="roughness" min="0.1" max="2" value="1" step="0.1">
      </div>
      <div class="control-group">
        <label for="wireframe">Wireframe Mode</label>
        <input type="checkbox" id="wireframe">
      </div>
      <div class="control-group">
        <label for="color-theme">Visual Theme</label>
        <select id="color-theme">
          <option value="synthwave">Synthwave</option>
          <option value="desert">Martian Desert</option>
          <option value="neon">Neon Grid</option>
        </select>
      </div>
    </div>
  </div>
  
  <canvas id="webgl-canvas"></canvas>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
