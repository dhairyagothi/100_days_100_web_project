<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typewriter</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #f8fafc;
            --glow-color: rgba(59, 130, 246, 0.15);
            --paper-bg: #ffffff;
            --paper-text: #222222;
            --paper-line: #d0d0d0;
            --body-grad-a: #667eea;
            --body-grad-b: #764ba2;
            --body-grad-c: #5a4a8a;
            /* dark mode keys = black with white text */
            --key-bg-a: #1a1a1a;
            --key-bg-b: #111111;
            --key-border: #333333;
            --key-text: #f5f5f5;
            --key-active-bg: #1e3a5f;
            --key-active-border: #3b82f6;
            --key-active-shadow: rgba(59, 130, 246, 0.55);
            --input-bg: rgba(255, 255, 255, 0.07);
            --input-border: rgba(255, 255, 255, 0.2);
            --input-color: #f5f5f5;
            --input-placeholder: rgba(255, 255, 255, 0.55);
        }

        .reset-key {
            width: 140px;
            height: 54px;
            border-radius: 10px;
            font-size: 11px;
            letter-spacing: 1px;
            white-space: nowrap;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .reset-row {
            justify-content: center;
        }

        body.light-theme {
            --bg-color: #ffffff;
            --text-color: #111111;
            --glow-color: rgba(59, 130, 246, 0.10);
            --body-grad-a: #7c85d8;
            --body-grad-b: #8b5fad;
            --body-grad-c: #6a56a2;
            /* light mode keys = white with dark text (original) */
            --key-bg-a: #f5f5f5;
            --key-bg-b: #e0e0e0;
            --key-border: #c8c8c8;
            --key-text: #222222;
            --key-active-bg: #dbeafe;
            --key-active-border: #3b82f6;
            --key-active-shadow: rgba(59, 130, 246, 0.5);
            --input-bg: rgba(0, 0, 0, 0.07);
            --input-border: rgba(0, 0, 0, 0.18);
            --input-color: #f5f5f5;
            --input-placeholder: rgba(255, 255, 255, 0.65);
        }

        body.vintage-theme {

            --bg-color: #3b2f2f;

            --text-color: #f5deb3;

            --paper-bg: #f4e7c5;

            --paper-text: #3b2f2f;

            --body-grad-a: #6b4f4f;

            --body-grad-b: #8b6f47;

            --body-grad-c: #4b3621;
        }

        body.terminal-theme {

            --bg-color: #000000;

            --text-color: #00ff00;

            --paper-bg: #001100;

            --paper-text: #00ff00;

            --body-grad-a: #001a00;

            --body-grad-b: #003300;

            --body-grad-c: #001100;
        }

        body.newspaper-theme {

            --bg-color: #f2f2e6;

            --text-color: #111111;

            --paper-bg: #fffdf5;

            --paper-text: #111111;

            --body-grad-a: #d9d2c3;

            --body-grad-b: #c2b280;

            --body-grad-c: #a89f91;
        }

        body.cyberpunk-theme {

            --bg-color: #0f0f1a;

            --text-color: #ff00ff;

            --paper-bg: #1a1a2e;

            --paper-text: #00ffff;

            --body-grad-a: #ff00ff;

            --body-grad-b: #6a00ff;

            --body-grad-c: #00ffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            font-family: 'Courier Prime', 'Courier New', monospace;
            padding: 20px;
            position: relative;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: var(--glow-color);
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
            animation: floatingGlow 8s ease-in-out infinite;
        }

        body::before {
            top: -120px;
            left: -120px;
        }

        body::after {
            bottom: -120px;
            right: -120px;
            animation-delay: 4s;
        }

        @keyframes floatingGlow {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(28px);
            }
        }

        /* ---- Theme toggle ---- */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.3s ease;
            user-select: none;
        }



        .sound-toggle {

            position: fixed;

            top: 80px;

            right: 20px;

            padding: 10px 16px;

            border: none;

            border-radius: 10px;

            /*background: rgba(0,0,0,0.6);*/

            background:  linear-gradient(135deg, var(--body-grad-a) 0%, var(--body-grad-b) 50%, var(--body-grad-c) 100%);

            color: white;

            font-size: 14px;

            font-family: 'Courier Prime', monospace;

            cursor: pointer;

            z-index: 1000;

            transition: 0.3s ease;
        }

        .sound-toggle:hover {

            background: rgba(255,255,255,0.15);

            transform: scale(1.05);
        }


        .theme-toggle:hover {
            transform: scale(1.15) rotate(20deg);
        }

        /* ---- Machine wrapper ---- */
        .typewriter-machine {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(96vw, 1200px);
        }

        /* ---- Paper ---- */
        .paper-sheet {
            width: 100%;

            height: 30vh;

            overflow-y: auto;

            background: var(--paper-bg);

            color: var(--paper-text);

            padding: 28px 30px;

            border-radius: 8px 8px 0 0;

            box-shadow: 0 0 32px rgba(59, 130, 246, 0.18);

            font-family: 'Courier Prime', monospace;

            font-size: clamp(1.2rem, 1.8vw, 1.9rem);

            line-height: 2.05;

            word-wrap: break-word;

            overflow-wrap: break-word;

            letter-spacing: 0.04em;

            position: relative;

            transition: background 0.4s ease,
            color 0.4s ease;

            text-align: left;
        }


        #typewriterText {
            position: relative;
            z-index: 2;
            white-space: pre-wrap;
        }

        .cursor-paper {
            display: inline-block;
            background-color: var(--paper-text);
            width: 2px;
            height: 1em;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink-paper 1s infinite;
            position: relative;
            z-index: 2;
            transition: background-color 0.4s;
        }

        @keyframes blink-paper {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0;
            }
        }

        /* ---- Typewriter body ---- */
        .typewriter-body {
            width: 100%;
            background: linear-gradient(135deg, var(--body-grad-a) 0%, var(--body-grad-b) 50%, var(--body-grad-c) 100%);
            padding: 44px 36px 40px;
            border-radius: 0 0 18px 18px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45), inset 0 2px 5px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* ---- Input ---- */
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #userInput {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--input-color);
            font-family: 'Courier Prime', monospace;
            transition: border-color 0.25s, background-color 0.25s, box-shadow 0.25s;
        }

        #userInput:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.55);
            background-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.22);
        }

        #userInput::placeholder {
            color: var(--input-placeholder);
        }

        /* ---- Keyboard ---- */
        .keyboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 13px;
            width: 100%;
        }

        .keyboard-row {
            display: flex;
            gap: 11px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .key {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--key-bg-a), var(--key-bg-b));
            border: 2px solid var(--key-border);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.32),
            inset 0 1px 3px rgba(255, 255, 255, 0.8),
            inset 0 -2px 3px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--key-text);
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, border-color 0.12s ease;
            position: relative;
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .key:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.38), inset 0 1px 3px rgba(255, 255, 255, 0.8);
        }

        .key.pressed,
        .key:active {
            transform: translateY(2px);
            background: linear-gradient(145deg, var(--key-active-bg), #bfdbfe);
            border-color: var(--key-active-border);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.28),
            0 0 10px var(--key-active-shadow),
            inset 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        #row-numbers .key {
            width: 70px;
            border-radius: 14px;
            font-size: 13px;
        }

        .key.space {
            width: 420px;
            border-radius: 22px;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .key.backspace {
            width: 90px;
            border-radius: 10px;
            font-size: 11px;
        }

        .key.enter-key {
            width: 90px;
            border-radius: 10px;
            font-size: 11px;
        }

        /* ---- Responsive ---- */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .paper-sheet {
                padding: 18px;
                min-height: 140px;
                font-size: 1.1rem;
            }

            .typewriter-body {
                padding: 18px;
                gap: 14px;
            }

            .keyboard-row {
                gap: 7px;
            }

            .key {
                width: 38px;
                height: 38px;
                font-size: 8px;
            }

            .key.space {
                width: 230px;
            }

            .key.backspace, .key.enter-key {
                width: 58px;
            }

            .theme-toggle {
                top: 10px;
                right: 12px;
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            .paper-sheet {
                padding: 13px;
                min-height: 110px;
                font-size: 0.95rem;
            }

            .typewriter-body {
                padding: 12px;
                gap: 10px;
            }

            .keyboard-row {
                gap: 5px;
            }

            .key {
                width: 32px;
                height: 32px;
                font-size: 7px;
            }

            .key.space {
                width: 190px;
            }

            .key.backspace, .key.enter-key {
                width: 50px;
            }
        }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px 25px;
            border-radius: 12px;
            text-align: center;
            min-width: 120px;
            backdrop-filter: blur(8px);
        }

        .stat-box h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #f5f5f5;
        }

        .stat-box p {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .theme-selector {

            position: fixed;

            top: 140px;

            right: 20px;

            padding: 10px 14px;

            border-radius: 10px;

            border: none;

            outline: none;

            cursor: pointer;

            z-index: 100;

            font-family: 'Courier Prime', monospace;

            background: rgba(0,0,0,0.6);

            color: white;

            font-size: 14px;
        }
        /*Shift Key feature *******************/
        .shift-active {

            background: linear-gradient(
                    145deg,
                    #60a5fa,
                    #2563eb
            ) !important;

            border-color: #93c5fd !important;

            box-shadow:
                    0 0 15px rgba(59,130,246,0.8) !important;

            color: white !important;
        }
    </style>
</head>
<body>
<div class="theme-toggle" id="themeToggle">🌙</div>

<select id="themeSelector" class="theme-selector">

    <option value="dark">Dark</option>

    <option value="light">Light</option>

    <option value="vintage">Vintage</option>

    <option value="terminal">Terminal</option>

    <option value="newspaper">Newspaper</option>

    <option value="cyberpunk">Cyberpunk</option>

</select>

<button id="soundToggle" class="sound-toggle">
    🔊 Sound ON
</button>


<div class="typewriter-machine">
    <div class="paper-sheet">
        <span id="typewriterText"></span><span class="cursor-paper"></span>
    </div>


    <div class="typewriter-body">
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type here or click the keys below…">

            <div class="stats-container">

                <div class="stat-box">

            </div>

            <div class="keyboard-row" id="row1">
                <div class="key" data-char="Q">Q</div>
                <div class="key" data-char="W">W</div>
                <div class="key" data-char="E">E</div>
                <div class="key" data-char="R">R</div>
                <div class="key" data-char="T">T</div>
                <div class="key" data-char="Y">Y</div>
                <div class="key" data-char="U">U</div>
                <div class="key" data-char="I">I</div>
                <div class="key" data-char="O">O</div>
                <div class="key" data-char="P">P</div>
            </div>

            <div class="keyboard-row">
                <div class="key" data-char="A">A</div>
                <div class="key" data-char="S">S</div>
                <div class="key" data-char="D">D</div>
                <div class="key" data-char="F">F</div>
                <div class="key" data-char="G">G</div>
                <div class="key" data-char="H">H</div>

                <div class="key" data-char="Z">Z</div>

            </div>

            <div class="keyboard-row">
                <div class="key enter-key" data-char="ENTER">↵ RET</div>
                <div class="key space" data-char=" ">SPACE</div>
                <div class="key backspace" data-char="BACKSPACE">⌫ DEL</div>
                <div class="key reset-key" id="resetBtn" data-char="RESET">⟲ RESET</div>
                <div class="key shift" id="shiftBtn" data-char="">SHIFT</div>

        </div>

    </div>

</div>

</div>


<script>
    const typewriterText = document.getElementById("typewriterText");
    const userInput = document.getElementById("userInput");
    const themeToggle = document.getElementById("themeToggle");
    //Sound-Toggle Button Feature added***********************************
    const soundToggle = document.getElementById("soundToggle");
    //Theme-toggle Feature Added
    const themeSelector = document.getElementById("themeSelector");
    const resetBtn = document.getElementById("resetBtn");


    // ---- Audio ----
    let audioCtx;

    let soundEnabled = true;

    function getAudioCtx() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
            }
        }
        return audioCtx;
    }

    // Realistic typewriter clack — sharp noise burst + pitched transient


    //Replaced playclick() Function.
    function playClick(noiseVol, freq1, freq2, dur) {

        // STOP SOUND IF MUTED
        if (!soundEnabled) return;

        const ctx = getAudioCtx();

        if (!ctx) return;

        try {

            const now = ctx.currentTime;

            const bufSize =
                Math.ceil(ctx.sampleRate * dur);

            const buf =
                ctx.createBuffer(
                    1,
                    bufSize,
                    ctx.sampleRate
                );

            const data =
                buf.getChannelData(0);

            for (let i = 0; i < bufSize; i++) {

                const env =
                    Math.pow(1 - i / bufSize, 3);

                data[i] =
                    (Math.random() * 2 - 1) * env;
            }

            const noise =
                ctx.createBufferSource();

            const noiseGain =
                ctx.createGain();

            const hpf =
                ctx.createBiquadFilter();

            hpf.type = 'highpass';

            hpf.frequency.value = 800;

            noise.buffer = buf;

            noiseGain.gain.setValueAtTime(
                noiseVol,
                now
            );

            noise.connect(hpf);

            hpf.connect(noiseGain);

            noiseGain.connect(ctx.destination);

            noise.start(now);

            const osc =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            osc.connect(gain);

            gain.connect(ctx.destination);

            osc.frequency.setValueAtTime(
                freq1,
                now
            );

            osc.frequency.exponentialRampToValueAtTime(
                freq2,
                now + dur
            );

            gain.gain.setValueAtTime(
                noiseVol * 0.5,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + dur
            );

            osc.start(now);

            osc.stop(now + dur);

        } catch(e) {}
    }

    // Letters & numbers: sharp crisp clack — same sound for all
    function playKeyClick() {
        playClick(0.55, 900, 200, 0.035);
    }

    // RET, SPACE, DEL: one unified heavy thud — clearly different from letter keys
    function playHeavyKey() {
        playClick(0.40, 140, 75, 0.12);
    }

    function playSpaceClick() {
        playHeavyKey();
    }

    function playReturn() {
        playHeavyKey();
    }

    function playBackspace() {
        playHeavyKey();
    }

    // ---- Live typing on paper ----
    // The paper shows what the user types character by character with the sound.
    // Input box is synced.

    let paperContent = '';

    let startTime = null;

    const wpmDisplay =
        document.getElementById("wpm");

    const charDisplay =
        document.getElementById("charCount");

    const timerDisplay =
        document.getElementById("timer");

    function scrollPaperToBottom() {
        const paperSheet = document.querySelector('.paper-sheet');

        paperSheet.scrollTo({
            top: paperSheet.scrollHeight,
            behavior: "smooth"
        });
    }

    function addCharToPaper(ch) {

        // START TIMER
        if (!startTime) {
            startTime = new Date();
        }

        paperContent += ch;

        typewriterText.textContent =
            paperContent;

        scrollPaperToBottom();

        if (ch === ' ')
            playSpaceClick();

        else
            playKeyClick();

        if (ch !== '\n')
            flashKey(ch.toUpperCase());

        updateStats();
    }


    function deleteCharFromPaper() {

        if (paperContent.length === 0)
            return;

        paperContent =
            paperContent.slice(0, -1);

        typewriterText.textContent =
            paperContent;

        scrollPaperToBottom();

        playBackspace();

        updateStats();
    }

    function clearPaper() {

        paperContent = '';

        typewriterText.textContent = '';

        startTime = null;

        updateStats();
    }

    function updateStats() {

        // CHARACTER COUNT
        charDisplay.textContent =
            paperContent.length;

        // TIMER
        let seconds = 0;

        if (startTime) {

            seconds =
                Math.floor(
                    (new Date() - startTime) / 1000
                );
        }

        timerDisplay.textContent =
            `${seconds}s`;

        // WORD COUNT
        const words =
            paperContent
                .trim()
                .split(/\s+/)
                .filter(word => word !== "")
                .length;

        // WPM
        const minutes =
            seconds / 60;

        const wpm =
            minutes > 0
                ? Math.round(words / minutes)
                : 0;

        wpmDisplay.textContent =
            wpm;
    }

    // ---- Flash key highlight ----
    function flashKey(char) {
        const key = document.querySelector(`.key[data-char="${char}"]`);
        if (!key) return;
        key.classList.add('pressed');
        setTimeout(() => key.classList.remove('pressed'), 130);
    }

    // ---- Physical keyboard → paper ----
    document.addEventListener('keydown', (e) => {

        // Prevent typing directly inside input field
        e.preventDefault();

        if (e.key === 'Backspace') {
            deleteCharFromPaper();
            flashKey('BACKSPACE');
            return;
        }

        if (e.key === 'Enter') {
            paperContent += '\n';
            typewriterText.textContent = paperContent;
            scrollPaperToBottom();
            playReturn();
            flashKey('ENTER');
            return;
        }

        // Allow both uppercase and lowercase typing
        if (e.key.length === 1) {
            addCharToPaper(e.key);

            // Highlight matching virtual key
            flashKey(e.key.toUpperCase());
        }
    });

        // Allows User to write special Character and symbols

    // ---- On-screen keys → paper ----
    document.querySelectorAll('.key').forEach(key => {
        key.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const ch = key.dataset.char;
            if (ch === 'BACKSPACE') {
                deleteCharFromPaper();
                return;
            }
            if (ch === 'ENTER') {
                paperContent += '\n';
                typewriterText.textContent = paperContent;
                scrollPaperToBottom();
                scrollPaperToBottom();
                playReturn();
                return;
            }
            addCharToPaper(ch === ' ' ? ' ' : ch);
        });

        key.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const ch = key.dataset.char;
            if (ch === 'BACKSPACE') {
                deleteCharFromPaper();
                return;
            }
            if (ch === 'ENTER') {
                paperContent += '\n';
                typewriterText.textContent = paperContent;
                playReturn();
                return;
            }
            addCharToPaper(ch === ' ' ? ' ' : ch);
        }, {passive: false});
    });

    // ---- Theme toggle ----
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('light-theme');
        const isLight = document.body.classList.contains('light-theme');
        themeToggle.textContent = isLight ? '☀️' : '🌙';
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });

    /*Multiple-Theme-toggle----*/
    themeSelector.addEventListener("change", () => {

        // REMOVE OLD THEMES
        document.body.classList.remove(
            "light-theme",
            "vintage-theme",
            "terminal-theme",
            "newspaper-theme",
            "cyberpunk-theme"
        );

        const selectedTheme =
            themeSelector.value;

        // APPLY SELECTED THEME
        if (selectedTheme !== "dark") {

            document.body.classList.add(
                `${selectedTheme}-theme`
            );
        }

        // SAVE THEME
        localStorage.setItem(
            "selectedTheme",
            selectedTheme
        );
    });

    //----Sound toggle --------
    soundToggle.addEventListener("click", () => {

        soundEnabled = !soundEnabled;

        if (soundEnabled) {

            soundToggle.textContent =
                "🔊 Sound ON";
        }

        else {

            soundToggle.textContent =
                "🔇 Sound OFF";
        }
    });

    resetBtn.addEventListener('click', () => {
        clearPaper();
        userInput.value = '';
    });

    const savedTheme =
        localStorage.getItem("selectedTheme");

    if (savedTheme) {

        themeSelector.value = savedTheme;

        if (savedTheme !== "dark") {

            document.body.classList.add(
                `${savedTheme}-theme`
            );
        }
    }

    setInterval(() => {

        if (paperContent.length > 0) {

            updateStats();
        }

    }, 1000);
</script>
</body>
</html>
