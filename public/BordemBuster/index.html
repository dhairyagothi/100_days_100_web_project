<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boredom Buster</title>
  <script>
    // Ensure trailing slash for correct relative asset loading on static hosts
    if (!window.location.pathname.endsWith('/') && !window.location.pathname.match(/\.[a-zA-Z0-9]+$/)) {
      window.location.pathname = window.location.pathname + '/';
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bb">

  <div class="navbar">
    <div class="nav-brand">
      <div class="nav-dot"></div>
      <span class="nav-title">Boredom Buster</span>
    </div>
    <div class="nav-saved" id="saved-toggle" role="button" tabindex="0" aria-label="View saved activities">
      <i class="ti ti-bookmark" aria-hidden="true"></i>
      <span id="saved-lbl">Saved · 0</span>
    </div>
  </div>

  <div class="hero">
    <div class="hero-eyebrow">Activity finder · open source</div>
    <div class="hero-heading">Nothing to do?<br><em>Let's fix that.</em></div>
    <div class="hero-sub">Pick a category, set your filters, get an instant suggestion.</div>
  </div>

  <div class="body">

    <div>
      <div class="field-label">Category</div>
      <div class="cat-grid" id="cat-grid">
        <button class="cat-btn on" data-val=""><i class="ti ti-sparkles" aria-hidden="true"></i><span class="cat-label">Any</span></button>
        <button class="cat-btn" data-val="education"><i class="ti ti-book" aria-hidden="true"></i><span class="cat-label">Learn</span></button>
        <button class="cat-btn" data-val="recreational"><i class="ti ti-device-gamepad-2" aria-hidden="true"></i><span class="cat-label">Play</span></button>
        <button class="cat-btn" data-val="social"><i class="ti ti-users" aria-hidden="true"></i><span class="cat-label">Social</span></button>
        <button class="cat-btn" data-val="diy"><i class="ti ti-tools" aria-hidden="true"></i><span class="cat-label">DIY</span></button>
        <button class="cat-btn" data-val="cooking"><i class="ti ti-salad" aria-hidden="true"></i><span class="cat-label">Cook</span></button>
        <button class="cat-btn" data-val="relaxation"><i class="ti ti-leaf" aria-hidden="true"></i><span class="cat-label">Chill</span></button>
        <button class="cat-btn" data-val="music"><i class="ti ti-music" aria-hidden="true"></i><span class="cat-label">Music</span></button>
        <button class="cat-btn" data-val="charity"><i class="ti ti-heart" aria-hidden="true"></i><span class="cat-label">Give</span></button>
        <button class="cat-btn" data-val="busywork"><i class="ti ti-checklist" aria-hidden="true"></i><span class="cat-label">Hustle</span></button>
      </div>
    </div>

    <div class="two-col">
      <div class="dark-card">
        <div class="field-label">Budget</div>
        <div class="budget-list" id="budget-list">
          <button class="b-row on" data-val=""><div class="b-circle"></div><div class="b-name">Any</div></button>
          <button class="b-row" data-val="free"><div class="b-circle"></div><div class="b-name">Free</div><div class="b-desc">zero spend</div></button>
          <button class="b-row" data-val="cheap"><div class="b-circle"></div><div class="b-name">Cheap</div><div class="b-desc">spare change</div></button>
          <button class="b-row" data-val="expensive"><div class="b-circle"></div><div class="b-name">Splurge</div><div class="b-desc">treat yourself</div></button>
        </div>
      </div>
      <div class="dark-card">
        <div class="field-label">Group size</div>
        <div class="size-btns" id="size-btns">
          <button class="sz-btn on" data-val="0">Solo</button>
          <button class="sz-btn" data-val="2">2</button>
          <button class="sz-btn" data-val="3">3</button>
          <button class="sz-btn" data-val="4">4</button>
          <button class="sz-btn" data-val="5">5</button>
          <button class="sz-btn" data-val="6">6+</button>
        </div>
      </div>
    </div>

    <div class="result-area">
      <div class="result-inner">
        <div id="v-idle" class="r-idle">
          <i class="ti ti-arrow-up-left" aria-hidden="true"></i>
          Set your filters and hit the button below
        </div>
        <div id="v-load" class="r-spin hidden">
          <div class="spinner"></div>
          <span id="spin-txt">Scanning the universe…</span>
        </div>
        <div id="v-result" class="hidden">
          <div class="r-badge"><div class="r-pulse"></div><span id="r-type"></span></div>
          <div class="r-activity" id="r-act"></div>
          <div class="r-tags" id="r-tags"></div>
        </div>
        <div id="v-err" class="hidden">
          <div class="r-err" id="r-err-msg"></div>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button class="go-btn" id="go-btn">
        <i class="ti ti-bolt" aria-hidden="true"></i>
        <span id="go-lbl">Find my activity</span>
      </button>
      <button class="side-btn hidden" id="again-btn"><i class="ti ti-refresh" aria-hidden="true"></i> Again</button>
      <button class="side-btn hidden" id="save-btn"><i class="ti ti-bookmark" aria-hidden="true"></i> Save</button>
    </div>

    <div class="saved-panel hidden" id="saved-panel">
      <div class="sp-top">
        <div class="sp-heading">Saved activities</div>
        <button class="sp-x" id="sp-close" aria-label="Close saved panel"><i class="ti ti-x" aria-hidden="true"></i></button>
      </div>
      <div id="sp-body"></div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
