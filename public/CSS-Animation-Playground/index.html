<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CSS Animation Playground — Visually create stunning CSS animations with a live preview, keyframe editor, preset library, and instant code export." />
  <title>CSS Animation Playground — Build Beautiful Animations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated Grid Background -->
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="app" id="app">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <span class="logo-cube">
            <span class="cube-face front"></span>
            <span class="cube-face back"></span>
            <span class="cube-face left"></span>
            <span class="cube-face right"></span>
            <span class="cube-face top"></span>
            <span class="cube-face bottom"></span>
          </span>
          <h1>CSS <span class="accent">Animate</span></h1>
        </div>
        <p class="tagline">Build stunning animations visually</p>
      </div>
      <div class="header-right">
        <button class="btn-icon-action" id="btn-reset" title="Reset All">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
      </div>
    </header>

    <!-- ===== PRESETS BAR ===== -->
    <section class="presets-section" id="presets-section">
      <h3 class="section-title">✨ Presets</h3>
      <div class="presets-grid" id="presets-grid">
        <button class="preset-btn" data-preset="bounce"><span class="preset-icon">🏀</span>Bounce</button>
        <button class="preset-btn" data-preset="fadeIn"><span class="preset-icon">🌅</span>Fade In</button>
        <button class="preset-btn" data-preset="slideIn"><span class="preset-icon">➡️</span>Slide In</button>
        <button class="preset-btn" data-preset="spin"><span class="preset-icon">🔄</span>Spin</button>
        <button class="preset-btn" data-preset="pulse"><span class="preset-icon">💓</span>Pulse</button>
        <button class="preset-btn" data-preset="shake"><span class="preset-icon">📳</span>Shake</button>
        <button class="preset-btn" data-preset="flip"><span class="preset-icon">🔃</span>Flip</button>
        <button class="preset-btn" data-preset="zoomIn"><span class="preset-icon">🔍</span>Zoom In</button>
        <button class="preset-btn" data-preset="swing"><span class="preset-icon">🎠</span>Swing</button>
        <button class="preset-btn" data-preset="rubberBand"><span class="preset-icon">🪀</span>Rubber</button>
        <button class="preset-btn" data-preset="jello"><span class="preset-icon">🍮</span>Jello</button>
        <button class="preset-btn" data-preset="heartbeat"><span class="preset-icon">💗</span>Heartbeat</button>
      </div>
    </section>

    <!-- ===== MAIN WORKSPACE ===== -->
    <main class="workspace">

      <!-- LEFT PANEL: Controls -->
      <aside class="panel controls-panel" id="controls-panel">
        <h3 class="panel-title">⚙️ Animation Settings</h3>

        <!-- Animation Name -->
        <div class="control-group">
          <label class="control-label" for="anim-name">Animation Name</label>
          <input type="text" id="anim-name" class="control-input" value="myAnimation" spellcheck="false" />
        </div>

        <!-- Duration -->
        <div class="control-group">
          <label class="control-label">Duration <span class="control-value" id="val-duration">1s</span></label>
          <input type="range" id="ctrl-duration" class="control-slider" min="0.1" max="5" step="0.1" value="1" />
        </div>

        <!-- Delay -->
        <div class="control-group">
          <label class="control-label">Delay <span class="control-value" id="val-delay">0s</span></label>
          <input type="range" id="ctrl-delay" class="control-slider" min="0" max="3" step="0.1" value="0" />
        </div>

        <!-- Timing Function -->
        <div class="control-group">
          <label class="control-label" for="ctrl-easing">Timing Function</label>
          <select id="ctrl-easing" class="control-select">
            <option value="ease">ease</option>
            <option value="linear">linear</option>
            <option value="ease-in">ease-in</option>
            <option value="ease-out">ease-out</option>
            <option value="ease-in-out">ease-in-out</option>
            <option value="cubic-bezier(0.68,-0.55,0.27,1.55)">elastic</option>
            <option value="cubic-bezier(0.25,0.46,0.45,0.94)">smooth</option>
            <option value="steps(5, end)">steps(5)</option>
          </select>
        </div>

        <!-- Iteration Count -->
        <div class="control-group">
          <label class="control-label">Iterations <span class="control-value" id="val-iterations">infinite</span></label>
          <div class="control-row">
            <input type="range" id="ctrl-iterations" class="control-slider" min="1" max="10" step="1" value="10" />
            <label class="control-checkbox-label">
              <input type="checkbox" id="ctrl-infinite" checked /> ∞
            </label>
          </div>
        </div>

        <!-- Direction -->
        <div class="control-group">
          <label class="control-label" for="ctrl-direction">Direction</label>
          <select id="ctrl-direction" class="control-select">
            <option value="normal">normal</option>
            <option value="reverse">reverse</option>
            <option value="alternate" selected>alternate</option>
            <option value="alternate-reverse">alternate-reverse</option>
          </select>
        </div>

        <!-- Fill Mode -->
        <div class="control-group">
          <label class="control-label" for="ctrl-fill">Fill Mode</label>
          <select id="ctrl-fill" class="control-select">
            <option value="none">none</option>
            <option value="forwards" selected>forwards</option>
            <option value="backwards">backwards</option>
            <option value="both">both</option>
          </select>
        </div>

        <!-- Preview Shape -->
        <h3 class="panel-title" style="margin-top:20px;">🎯 Preview Shape</h3>
        <div class="shape-selector" id="shape-selector">
          <button class="shape-btn active" data-shape="box" title="Box">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="currentColor"/></svg>
          </button>
          <button class="shape-btn" data-shape="circle" title="Circle">
            <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/></svg>
          </button>
          <button class="shape-btn" data-shape="text" title="Text">
            <svg width="24" height="24" viewBox="0 0 24 24"><text x="5" y="18" font-size="16" font-weight="bold" fill="currentColor">A</text></svg>
          </button>
          <button class="shape-btn" data-shape="card" title="Card">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="currentColor"/><line x1="3" y1="10" x2="21" y2="10" stroke="var(--bg-primary)" stroke-width="1.5"/></svg>
          </button>
          <button class="shape-btn" data-shape="star" title="Star">
            <svg width="24" height="24" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9" fill="currentColor"/></svg>
          </button>
        </div>

        <!-- Preview Color -->
        <div class="control-group" style="margin-top:12px;">
          <label class="control-label">Preview Color</label>
          <div class="color-picker-row">
            <input type="color" id="ctrl-preview-color" class="control-color" value="#00f5d4" />
            <span class="color-hex" id="preview-color-hex">#00f5d4</span>
          </div>
        </div>
      </aside>

      <!-- CENTER: Live Preview -->
      <section class="panel preview-panel" id="preview-panel">
        <h3 class="panel-title">👁️ Live Preview</h3>
        <div class="preview-stage" id="preview-stage">
          <div class="stage-grid"></div>
          <div class="preview-element" id="preview-element">
            <span class="preview-text">Animate</span>
          </div>
        </div>
        <div class="preview-controls">
          <button class="btn-preview" id="btn-play" title="Play/Pause">
            <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
            <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
          </button>
          <button class="btn-preview" id="btn-stop" title="Stop">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          </button>
          <div class="speed-control">
            <label>Speed:</label>
            <select id="ctrl-speed" class="control-select-mini">
              <option value="0.25">0.25x</option>
              <option value="0.5">0.5x</option>
              <option value="1" selected>1x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
          </div>
        </div>

        <!-- Keyframe Timeline -->
        <div class="keyframe-section">
          <div class="keyframe-header">
            <h3 class="panel-title" style="margin:0;">🎬 Keyframes</h3>
            <button class="btn-add-kf" id="btn-add-keyframe" title="Add Keyframe">+ Add</button>
          </div>
          <div class="timeline-container" id="timeline-container">
            <div class="timeline-track" id="timeline-track">
              <div class="timeline-bar"></div>
              <!-- Keyframe dots will be injected -->
            </div>
            <div class="timeline-labels">
              <span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>
            </div>
          </div>

          <!-- Keyframe Properties -->
          <div class="keyframe-props" id="keyframe-props">
            <div class="kf-prop-header">
              <span class="kf-prop-title" id="kf-title">Keyframe: 0%</span>
              <div class="kf-prop-actions">
                <label class="control-label" style="margin:0;font-size:12px;">Position:</label>
                <input type="number" id="kf-percent" class="control-input-mini" min="0" max="100" value="0" />
                <span style="font-size:12px;color:var(--text-muted)">%</span>
                <button class="btn-delete-kf" id="btn-delete-kf" title="Delete Keyframe">🗑️</button>
              </div>
            </div>
            <div class="kf-controls-grid">
              <!-- TranslateX -->
              <div class="kf-control">
                <label>TranslateX <span class="kf-val" id="kf-val-tx">0px</span></label>
                <input type="range" id="kf-translateX" class="control-slider accent-cyan" min="-200" max="200" step="1" value="0" />
              </div>
              <!-- TranslateY -->
              <div class="kf-control">
                <label>TranslateY <span class="kf-val" id="kf-val-ty">0px</span></label>
                <input type="range" id="kf-translateY" class="control-slider accent-pink" min="-200" max="200" step="1" value="0" />
              </div>
              <!-- Rotate -->
              <div class="kf-control">
                <label>Rotate <span class="kf-val" id="kf-val-rot">0°</span></label>
                <input type="range" id="kf-rotate" class="control-slider accent-yellow" min="-360" max="360" step="1" value="0" />
              </div>
              <!-- Scale -->
              <div class="kf-control">
                <label>Scale <span class="kf-val" id="kf-val-scale">1</span></label>
                <input type="range" id="kf-scale" class="control-slider accent-green" min="0" max="3" step="0.05" value="1" />
              </div>
              <!-- SkewX -->
              <div class="kf-control">
                <label>SkewX <span class="kf-val" id="kf-val-skx">0°</span></label>
                <input type="range" id="kf-skewX" class="control-slider accent-orange" min="-45" max="45" step="1" value="0" />
              </div>
              <!-- Opacity -->
              <div class="kf-control">
                <label>Opacity <span class="kf-val" id="kf-val-opacity">1</span></label>
                <input type="range" id="kf-opacity" class="control-slider accent-purple" min="0" max="1" step="0.05" value="1" />
              </div>
              <!-- Border Radius -->
              <div class="kf-control">
                <label>Border Radius <span class="kf-val" id="kf-val-radius">8px</span></label>
                <input type="range" id="kf-borderRadius" class="control-slider accent-cyan" min="0" max="50" step="1" value="8" />
              </div>
              <!-- Background Color -->
              <div class="kf-control">
                <label>Background</label>
                <div class="color-picker-row">
                  <input type="color" id="kf-bgColor" class="control-color" value="#00f5d4" />
                  <span class="color-hex" id="kf-bg-hex">#00f5d4</span>
                </div>
              </div>
              <!-- Box Shadow Blur -->
              <div class="kf-control">
                <label>Shadow Blur <span class="kf-val" id="kf-val-shadow">20px</span></label>
                <input type="range" id="kf-shadow" class="control-slider accent-pink" min="0" max="60" step="1" value="20" />
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- RIGHT PANEL: Code Output -->
      <aside class="panel code-panel" id="code-panel">
        <div class="code-header">
          <h3 class="panel-title">💻 Generated CSS</h3>
          <div class="code-actions">
            <button class="btn-copy" id="btn-copy" title="Copy to Clipboard">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Copy</span>
            </button>
          </div>
        </div>
        <div class="code-output-wrapper">
          <pre class="code-output" id="code-output"><code id="code-content"></code></pre>
        </div>
        <div class="copy-toast" id="copy-toast">✅ Copied to clipboard!</div>
      </aside>

    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>Made with ❤️ | CSS Animation Playground | HTML • CSS • JavaScript</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
