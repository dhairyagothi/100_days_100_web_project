<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typer - Relaxing Typing Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<a href="/" class="project-back-button" style="position:fixed;left:18px;top:18px;padding:8px 12px;border-radius:8px;background:white;text-decoration:none;z-index:9999;font-weight:700;font-family:Inter, system-ui, sans-serif;box-shadow:0 8px 20px rgba(0, 0, 0);">← Back to Home</a>

    <div class="container">
        <div class="header">
            <h1 class="title">Typer</h1>
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </div>

        <div class="test-area">
            <!-- Game Workspace Content -->
            <div id="gameContent">
                <div class="text-display" id="textDisplay"></div>
                <div class="input-section">
                    <input 
                        type="text" 
                        id="userInput" 
                        placeholder="Click here and start typing..." 
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>
                <div class="controls">
                    <button class="btn-start" id="startBtn">Start Test</button>
                    <button class="btn-reset" id="resetBtn">Reset</button>
                </div>
                <div class="stats hidden" id="stats">
                    <div class="stat-item">
                        <div class="stat-label">Time</div>
                        <div class="stat-value" id="timerDisplay">0:00</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">WPM</div>
                        <div class="stat-value" id="wpmDisplay">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Accuracy</div>
                        <div class="stat-value" id="accuracyDisplay">0%</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Typed</div>
                        <div class="stat-value" id="typedDisplay">0</div>
                    </div>
                </div>
            </div>

            <!-- Score / Result Content directly inside the card boundaries -->
            <div class="results" id="results">
                <h2>Test Complete! 🎉</h2>
                <div class="results-grid">
                    <div class="result-item">
                        <div class="result-label">Words Per Minute</div>
                        <div class="result-value" id="finalWpm">0</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Accuracy</div>
                        <div class="result-value" id="finalAccuracy">0%</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Time</div>
                        <div class="result-value" id="finalTime">0s</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Errors</div>
                        <div class="result-value" id="finalErrors">0</div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn-start" id="retryBtn">Try Again</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
