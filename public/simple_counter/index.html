<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter - 100 Days 100 Projects</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Simple Counter</h1>
        <div class="counter-display" id="counter">0</div>
        <div class="controls">
            <button id="decrease" class="btn"><i class="fas fa-minus"></i></button>
            <button id="reset" class="btn"><i class="fas fa-undo"></i></button>
            <button id="increase" class="btn"><i class="fas fa-plus"></i></button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
