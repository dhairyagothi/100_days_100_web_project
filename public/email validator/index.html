<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Validator</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Email Validator</h1>
      <p class="subtitle">
        Validate email addresses and check deliverability information.
      </p>

      <div class="input-group">
        <input
          type="email"
          id="username"
          placeholder="Enter email address"
          autocomplete="email"
          aria-label="Email address"
        />
        <button type="button" id="submitBtn" class="btn">Validate Email</button>
      </div>

      <details class="api-key-details">
        <summary>Optional: API key for deliverability checks</summary>
        <input
          type="password"
          id="apiKeyInput"
          placeholder="Paste API key from emailvalidation.io"
          autocomplete="off"
          aria-label="API key"
        />
      </details>

      <div id="resultCont" aria-live="polite"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
