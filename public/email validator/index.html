<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">
            <img src="email.svg" alt="logo">
            <span>Email Validator</span>
        </div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <main style="background-image: url('background.jpeg'); background-size: cover; background-position: center;">
        <div class="container">
            <h1>Email Validator</h1>
            <p>Enter an email address to validate it instantly.</p>
            <br>
            <input class="input" type="text" id="username" placeholder="Enter email address..." />
            <button class="btn" id="submitBtn">Validate</button>
            <br><br>
            <div id="resultCont"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Email Validator | 100 Days 100 Web Projects</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
