<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password &mdash; 100 Days 100 Web Projects</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />

    <style>
      .fp-step { display: none; width: 100%; }
      .fp-step.active { display: flex; flex-direction: column; gap: 20px; width: 100%; }

      .fp-message {
        display: none;
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 0.88rem;
        font-weight: 500;
        text-align: center;
        line-height: 1.5;
        margin-bottom: 8px;
      }
      .fp-message.show { display: block; }
      .fp-message.success { background: rgba(52,211,153,0.15); border: 1px solid rgba(52,211,153,0.3); color: #6ee7b7; }
      .fp-message.error { background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.3); color: #fca5a5; }
      .fp-message.info { background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.3); color: #c7d2fe; }

      .step-indicator {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .step-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #334155;
        transition: background 0.3s;
      }
      .step-dot.active { background: #6366f1; }
      .step-dot.completed { background: #34d399; }

      .otp-inputs {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .otp-input {
        width: 48px;
        height: 54px;
        text-align: center;
        font-size: 1.3rem;
        font-weight: 700;
        border: 2px solid #334155;
        border-radius: 12px;
        background: #0f172a;
        color: #f1f5f9;
        outline: none;
        transition: border-color 0.2s;
      }
      .otp-input:focus { border-color: #6366f1; }

      .resend-link {
        text-align: center;
        font-size: 13px;
        color: #94a3b8;
      }
      .resend-link a { color: #818cf8; cursor: pointer; text-decoration: none; }
      .resend-link a:hover { text-decoration: underline; }

      .fp-info {
        font-size: 13px;
        color: #94a3b8;
        text-align: center;
        line-height: 1.6;
      }

      .security-note {
        margin-top: 16px;
        padding: 10px 14px;
        background: rgba(251,191,36,0.1);
        border: 1px solid rgba(251,191,36,0.2);
        border-radius: 8px;
        font-size: 12px;
        color: #fbbf24;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a href="../../index.html" class="button home-btn"><i class="fa-solid fa-house"></i> Home</a>
      <a href="Login.html" class="button home-btn-secondary"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
      <a href="SignUp.html" class="button home-btn-secondary"><i class="fa-solid fa-user-plus"></i> Sign Up</a>
    </nav>

    <section class="hero-section">
      <h1 class="hero-title">Reset Your Password</h1>
      <p class="hero-desc">
        Enter your username to receive a password reset code.
      </p>

      <div class="auth-card">
        <h2 class="auth-title-1">Forgot Password</h2>

        <div id="fpMessage" class="fp-message"></div>

        <!-- Step 1: Username -->
        <div id="step1" class="fp-step active">
          <div class="form-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="fpUsername" placeholder="Enter your username" class="form-input" autocomplete="username" />
          </div>
          <button class="submit-btn" id="step1Btn">Send Reset Code</button>
          <p class="auth-footer-link"><a href="Login.html">Back to Login</a></p>
        </div>

        <!-- Step 2: OTP -->
        <div id="step2" class="fp-step">
          <p class="fp-info">Enter the 6-digit code sent to your email associated with this account.</p>
          <div class="otp-inputs">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="0" />
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="1" />
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="2" />
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="3" />
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="4" />
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="5" />
          </div>
          <button class="submit-btn" id="step2Btn">Verify Code</button>
          <p class="resend-link">Didn&rsquo;t receive it? <a id="resendCode">Resend code</a></p>
        </div>

        <!-- Step 3: New Password -->
        <div id="step3" class="fp-step">
          <div class="form-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="newPassword" placeholder="New password" class="form-input" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <i class="fa-solid fa-lock-open"></i>
            <input type="password" id="confirmNewPassword" placeholder="Confirm new password" class="form-input" autocomplete="new-password" />
          </div>
          <button class="submit-btn" id="step3Btn">Reset Password</button>
        </div>

        <div class="security-note">
          <i class="fa-solid fa-shield-halved"></i>
          This is a local demo. Passwords are stored in your browser only.
        </div>
      </div>
    </section>

    <script>
      function $(id) { return document.getElementById(id); }

      var currentOTP = "";
      var fpUsername = "";

      function showFpMessage(msg, type) {
        var el = $("fpMessage");
        if (!el) return;
        el.textContent = msg;
        el.className = "fp-message show " + (type || "info");
      }

      function showStep(stepNum) {
        document.querySelectorAll(".fp-step").forEach(function(s) { s.classList.remove("active"); });
        $("step" + stepNum).classList.add("active");
        document.querySelectorAll(".step-dot").forEach(function(d, i) {
          d.classList.toggle("active", i + 1 === stepNum);
          d.classList.toggle("completed", i + 1 < stepNum);
        });
      }

      function showToast(message, type) {
        var container = document.querySelector(".toast-container");
        if (!container) {
          container = document.createElement("div");
          container.className = "toast-container";
          document.body.appendChild(container);
        }
        var toast = document.createElement("div");
        toast.className = "toast " + (type || "info");
        var iconMap = {
          success: '<i class="fa-solid fa-circle-check"></i>',
          error: '<i class="fa-solid fa-circle-exclamation"></i>',
          warning: '<i class="fa-solid fa-triangle-exclamation"></i>',
          info: '<i class="fa-solid fa-circle-info"></i>'
        };
        toast.innerHTML =
          '<div class="toast-icon">' + (iconMap[type] || iconMap.info) + '</div>' +
          '<div class="toast-message">' + message.replace(/</g, "&lt;") + '</div>' +
          '<button class="toast-close" aria-label="Close">&times;</button>';
        container.appendChild(toast);
        toast.querySelector(".toast-close").addEventListener("click", function() {
          removeToast(toast);
        });
        var autoTimeout = setTimeout(function() { removeToast(toast); }, 4000);
        function removeToast(el) {
          el.style.opacity = "0";
          el.style.transform = "translateY(-10px) scale(0.95)";
          setTimeout(function() { el.remove(); }, 300);
          clearTimeout(autoTimeout);
        }
      }

      function generateOTP() {
        return Math.floor(100000 + Math.random() * 900000).toString();
      }

      $("step1Btn").addEventListener("click", function() {
        fpUsername = $("fpUsername").value.trim();
        if (!fpUsername) {
          showFpMessage("Please enter your username.", "error");
          return;
        }

        var storedRaw;
        try { storedRaw = localStorage.getItem("user_" + fpUsername); } catch (_) {}
        if (!storedRaw) {
          showFpMessage("No account found with this username.", "error");
          return;
        }

        currentOTP = generateOTP();
        try {
          sessionStorage.setItem("resetOTP", currentOTP);
          sessionStorage.setItem("resetUser", fpUsername);
        } catch (_) {}

        console.log("[DEV] OTP for " + fpUsername + ": " + currentOTP);

        showFpMessage("A reset code has been sent to your registered email.", "success");
        showStep(2);
      });

      document.querySelectorAll(".otp-input").forEach(function(input) {
        input.addEventListener("input", function() {
          this.value = this.value.replace(/[^0-9]/g, "");
          if (this.value && this.nextElementSibling && this.nextElementSibling.classList.contains("otp-input")) {
            this.nextElementSibling.focus();
          }
        });
        input.addEventListener("keydown", function(e) {
          if (e.key === "Backspace" && !this.value && this.previousElementSibling && this.previousElementSibling.classList.contains("otp-input")) {
            this.previousElementSibling.focus();
          }
        });
      });

      $("step2Btn").addEventListener("click", function() {
        var otp = "";
        document.querySelectorAll(".otp-input").forEach(function(inp) { otp += inp.value; });

        if (otp.length !== 6) {
          showFpMessage("Please enter the complete 6-digit code.", "error");
          return;
        }

        var storedOTP;
        try { storedOTP = sessionStorage.getItem("resetOTP"); } catch (_) {}

        if (otp !== storedOTP) {
          showFpMessage("Invalid code. Please try again.", "error");
          return;
        }

        showFpMessage("Code verified! Set your new password.", "success");
        showStep(3);
      });

      $("resendCode").addEventListener("click", function() {
        if (!fpUsername) {
          showFpMessage("Session expired. Please start over.", "error");
          return;
        }
        currentOTP = generateOTP();
        try { sessionStorage.setItem("resetOTP", currentOTP); } catch (_) {}
        console.log("[DEV] New OTP for " + fpUsername + ": " + currentOTP);
        showFpMessage("A new code has been sent.", "success");
      });

      function hashPassword(password) {
        var hash = 0;
        if (password.length === 0) return hash.toString(16);
        for (var i = 0; i < password.length; i++) {
          var ch = password.charCodeAt(i);
          hash = ((hash << 5) - hash) + ch;
          hash = hash & hash;
        }
        return Math.abs(hash).toString(16);
      }

      $("step3Btn").addEventListener("click", function() {
        var newPass = $("newPassword").value;
        var confirmPass = $("confirmNewPassword").value;

        if (!newPass || newPass.length < 6) {
          showFpMessage("Password must be at least 6 characters.", "error");
          return;
        }
        if (newPass !== confirmPass) {
          showFpMessage("Passwords do not match.", "error");
          return;
        }

        var storedRaw;
        try { storedRaw = localStorage.getItem("user_" + fpUsername); } catch (_) {}
        if (!storedRaw) {
          showFpMessage("Account not found. Please try again.", "error");
          return;
        }

        try {
          var userData = JSON.parse(storedRaw);
          userData.passwordHash = hashPassword(newPass);
          userData.updatedAt = Date.now();
          localStorage.setItem("user_" + fpUsername, JSON.stringify(userData));
          sessionStorage.removeItem("resetOTP");
          sessionStorage.removeItem("resetUser");
        } catch (_) {
          showFpMessage("Failed to reset password. Please try again.", "error");
          return;
        }

        showToast("Password reset successful! Redirecting to login&hellip;", "success");
        setTimeout(function() {
          window.location.href = "Login.html";
        }, 1500);
      });
    </script>
  </body>
</html>
