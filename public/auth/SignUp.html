<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up &mdash; 100 Days 100 Web Projects</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="../../index.html" class="button home-btn"><i class="fa-solid fa-house"></i> Home</a>
      <a href="Login.html" class="button home-btn-secondary"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
      <div class="nav-auth-status"></div>
    </nav>

    <section class="hero-section">
      <h1 class="hero-title">100 Days 100 Web Projects</h1>
      <p class="hero-desc">
        Create your free account to explore 100+ exciting web experiments crafted for learning and inspiration.
      </p>

      <div class="auth-card">
        <h2 class="auth-title-1">Sign Up</h2>

        <div id="statusMsg"></div>

        <form id="signupForm" novalidate>
          <div class="field-wrap">
            <div class="form-group" id="grp-name">
              <i class="fa-solid fa-id-card"></i>
              <input type="text" id="name" placeholder="Full Name" class="form-input" autocomplete="name" />
            </div>
            <span class="error-msg" id="err-name"></span>
          </div>

          <div class="field-wrap">
            <div class="form-group" id="grp-username">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="username" placeholder="Username" class="form-input" autocomplete="username" />
            </div>
            <span class="error-msg" id="err-username"></span>
          </div>

          <div class="field-wrap">
            <div class="form-group" id="grp-email">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="email" placeholder="Email Address" class="form-input" autocomplete="email" />
            </div>
            <span class="error-msg" id="err-email"></span>
          </div>

          <div class="field-wrap">
            <div class="form-group" id="grp-password">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="password" placeholder="Password" class="form-input" autocomplete="new-password" />
            </div>
            <span class="error-msg" id="err-password"></span>
          </div>

          <div class="field-wrap">
            <div class="form-group" id="grp-confirm-password">
              <i class="fa-solid fa-lock-open"></i>
              <input type="password" id="confirm-password" placeholder="Confirm Password" class="form-input" autocomplete="new-password" />
            </div>
            <span class="error-msg" id="err-confirm-password"></span>
          </div>

          <button type="submit" class="submit-btn" id="signupBtn">
            Sign Up <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <div class="auth-divider">or</div>

        <button id="googleLogin" class="button home-btn google-btn">
          <i class="fa-brands fa-google"></i> Continue with Google
        </button>

        <p class="auth-footer-link">
          Already signed up? <a href="Login.html">Login</a>
        </p>
      </div>
    </section>

    <script>
      function $(id) { return document.getElementById(id); }

      function showStatus(message, type) {
        var el = $("statusMsg");
        if (!el) return;
        el.textContent = message;
        el.className = type || "info";
        el.style.display = message ? "block" : "none";
      }

      function setField(grpId, errId, msg) {
        var grp = $(grpId);
        var err = $(errId);
        if (grp) {
          grp.classList.remove("error", "success");
          if (msg) grp.classList.add("error");
          else if (err && !err.textContent) grp.classList.add("success");
        }
        if (err) err.textContent = msg;
      }

      function showToast(message, type) {
        var container = document.querySelector(".toast-container");
        if (!container) {
          container = document.createElement("div");
          container.className = "toast-container";
          document.body.appendChild(container);
        }
        var toast = document.createElement("div");
        toast.className = "toast " + (type || "info");
        var iconMap = {
          success: '<i class="fa-solid fa-circle-check"></i>',
          error: '<i class="fa-solid fa-circle-exclamation"></i>',
          warning: '<i class="fa-solid fa-triangle-exclamation"></i>',
          info: '<i class="fa-solid fa-circle-info"></i>'
        };
        toast.innerHTML =
          '<div class="toast-icon">' + (iconMap[type] || iconMap.info) + '</div>' +
          '<div class="toast-message">' + message.replace(/</g, "&lt;") + '</div>' +
          '<button class="toast-close" aria-label="Close">&times;</button>';
        container.appendChild(toast);
        toast.querySelector(".toast-close").addEventListener("click", function() {
          removeToast(toast);
        });
        var autoTimeout = setTimeout(function() { removeToast(toast); }, 4000);
        function removeToast(el) {
          el.style.opacity = "0";
          el.style.transform = "translateY(-10px) scale(0.95)";
          setTimeout(function() { el.remove(); }, 300);
          clearTimeout(autoTimeout);
        }
      }

      function hashPassword(password) {
        var hash = 0;
        if (password.length === 0) return hash.toString(16);
        for (var i = 0; i < password.length; i++) {
          var ch = password.charCodeAt(i);
          hash = ((hash << 5) - hash) + ch;
          hash = hash & hash;
        }
        return Math.abs(hash).toString(16);
      }

      var emailRx = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      $("name").addEventListener("input", function() {
        var v = this.value.trim();
        setField("grp-name", "err-name",
          v.length === 0 ? "" :
          v.length < 3 ? "Name must be at least 3 characters" : "");
      });

      $("username").addEventListener("input", function() {
        var v = this.value.trim();
        setField("grp-username", "err-username",
          v.length === 0 ? "" :
          v.includes(" ") ? "Username cannot contain spaces" :
          v.length < 4 ? "Username must be at least 4 characters" : "");
      });

      $("email").addEventListener("input", function() {
        var v = this.value.trim();
        setField("grp-email", "err-email",
          v.length === 0 ? "" :
          !emailRx.test(v) ? "Enter a valid email address" : "");
      });

      $("password").addEventListener("input", function() {
        var v = this.value;
        if (v.length === 0) { setField("grp-password", "err-password", ""); return; }
        var hints = [];
        if (!/[A-Z]/.test(v)) hints.push("uppercase letter");
        if (!/[0-9]/.test(v)) hints.push("number");
        if (!/[!@#$%^&*]/.test(v)) hints.push("special char (!@#$%^&*)");
        if (v.length < 6) hints.push("6+ characters");
        setField("grp-password", "err-password", hints.length ? "Needs: " + hints.join(", ") : "");
        validateConfirmPassword();
      });

      function validateConfirmPassword() {
        var pass = $("password").value;
        var confirmPass = $("confirm-password").value;
        if (confirmPass.length === 0) {
          setField("grp-confirm-password", "err-confirm-password", "");
          $("signupBtn").disabled = false;
          return true;
        }
        if (pass !== confirmPass) {
          setField("grp-confirm-password", "err-confirm-password", "Passwords do not match");
          $("signupBtn").disabled = true;
          return false;
        }
        setField("grp-confirm-password", "err-confirm-password", "");
        $("signupBtn").disabled = false;
        return true;
      }

      $("confirm-password").addEventListener("input", validateConfirmPassword);

      $("signupForm").addEventListener("submit", function(e) {
        e.preventDefault();

        var name = $("name").value.trim();
        var username = $("username").value.trim();
        var email = $("email").value.trim();
        var password = $("password").value;
        var confirmPassword = $("confirm-password").value;

        var ok = true;

        if (name.length < 3) {
          setField("grp-name", "err-name", "Name must be at least 3 characters");
          ok = false;
        }
        if (username.includes(" ")) {
          setField("grp-username", "err-username", "Username cannot contain spaces");
          ok = false;
        } else if (username.length < 4) {
          setField("grp-username", "err-username", "Username must be at least 4 characters");
          ok = false;
        }
        if (!emailRx.test(email)) {
          setField("grp-email", "err-email", "Enter a valid email address");
          ok = false;
        }
        if (!/[A-Z]/.test(password) || !/[0-9]/.test(password) || !/[!@#$%^&*]/.test(password) || password.length < 6) {
          setField("grp-password", "err-password", "Password does not meet requirements");
          ok = false;
        }
        if (password !== confirmPassword) {
          setField("grp-confirm-password", "err-confirm-password", "Passwords do not match");
          ok = false;
        }

        if (!ok) return;

        try {
          var existingUser = localStorage.getItem("user_" + username);
          if (existingUser) {
            setField("grp-username", "err-username", "Username already taken");
            showToast("Username already exists.", "error");
            return;
          }
        } catch (_) {
          showToast("Unable to access local storage.", "error");
          return;
        }

        var passwordHash = hashPassword(password);

        try {
          localStorage.setItem("user_" + username, JSON.stringify({
            name: name,
            email: email,
            passwordHash: passwordHash,
            createdAt: Date.now(),
          }));
        } catch (_) {
          showToast("Unable to save account data.", "error");
          return;
        }

        showToast("Signup successful! Redirecting to login&hellip;", "success");
        $("signupBtn").disabled = true;

        setTimeout(function() {
          window.location.href = "Login.html";
        }, 1200);
      });
    </script>

    <script type="module">
      import { signInWithGoogle } from "./firebase-config.js";

      document.getElementById("googleLogin").addEventListener("click", async function() {
        try {
          this.disabled = true;
          this.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting&hellip;';
          await signInWithGoogle();
        } catch (err) {
          showToast(err.message || "Google sign-in failed.", "error");
          this.disabled = false;
          this.innerHTML = '<i class="fa-brands fa-google"></i> Continue with Google';
        }
      });
    </script>
  </body>
</html>
