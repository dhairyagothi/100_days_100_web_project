<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <link rel="icon" href="favv.png" type="image/x-icon" />
  <link rel="stylesheet" href="login.css" />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
</head>

<body>
  <header class="navbar">
    <a href="../index.html" class="nav-link">← Back to Home</a>
  </header>

  <div class="container">

    <!-- Left Section -->
    <div class="left-section">

      <button
        class="back-button"
        onclick="window.location.href='../index.html'"
      >
        ←
      </button>

      <h1 class="animated-heading">
        100 Days 100 Web Projects!
      </h1>

      <p class="description">
        Dive in to explore a user-friendly interface designed for secure and seamless access to your account.
      </p>

      <form id="loginForm" class="login-form">

        <input
          type="text"
          id="username"
          placeholder="Username"
          class="input-field"
          required
        />

        <input
          type="password"
          id="password"
          placeholder="Password"
          class="input-field"
          required
        />

        <button type="submit" class="submit-button">
          Login
        </button>

      </form>

      <p class="already-signed-up">
        Not signed up?
        <a href="./signup.html">Sign Up</a>
      </p>

    </div>

    <!-- Right Section -->
    <div class="right-section">

      <img
        src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?q=80&w=1200&auto=format&fit=crop"
        alt="Coding"
        class="transition-image"
      />

    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (username && password) {
        localStorage.setItem("username", username);
        window.location.href = "../index.html";
      } else {
        alert("Please fill in all fields.");
      }
    });
  </script>

</body>
</html>
