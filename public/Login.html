<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css" />
    <link rel="icon" href="favv.png" type="image/x-icon" />
  </head>

  <body>
    <!-- Navigation -->
    <header class="navbar">
      <a href="../index.html" class="nav-link">← Back to Home</a>
    </header>

    <!-- Main Container -->
    <main class="container">
      <!-- Left Section -->
      <section class="left">
        <p class="subtitle">Welcome Back</p>

        <h1>
          Build Something <span class="highlight">Amazing</span>
        </h1>

        <p class="description">
          Sign in to continue your journey through
          <strong>100 Days • 100 Web Projects</strong>.
        </p>

        <div class="feature-list">
          <div class="feature-card">✨ Modern UI</div>
          <div class="feature-card">⚡ Fast Projects</div>
          <div class="feature-card">🚀 Learn by Building</div>
        </div>
      </section>

      <!-- Right Form -->
      <section class="form-box">
        <button
          class="back-button"
          type="button"
          onclick="window.location.href = '../index.html'"
        >
          ←
        </button>

        <h2>Login</h2>
        <p class="form-subtitle">Enter your credentials to access your account.</p>

        <form id="loginForm">
          <div class="form-group">
            <input type="text" id="username" placeholder="Username" />
          </div>

          <div class="form-group">
            <input type="password" id="password" placeholder="Password" />
          </div>

          <!-- INLINE ERROR BOX -->
          <p
            id="errorBox"
            style="
              color: #ff4d4d;
              font-size: 14px;
              margin-top: 10px;
              min-height: 18px;
            "
          ></p>

          <button type="submit" class="login-btn">Login</button>
        </form>

        <p class="signup-text">
          New here? <a href="./signup.html">Sign Up</a>
        </p>
      </section>
    </main>

    <script>
      // Login form submission (NO alert, INLINE validation)
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const username = document
            .getElementById("username")
            .value.trim();

          const password = document
            .getElementById("password")
            .value.trim();

          const errorBox = document.getElementById("errorBox");

          if (username && password) {
            localStorage.setItem("username", username);
            window.location.pathname = "/index.html";
          } else {
            errorBox.textContent =
              "⚠ Please enter both username and password";
          }
        });
    </script>
  </body>
</html>
