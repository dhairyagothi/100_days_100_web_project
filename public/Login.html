<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — 100 Days 100 Web Projects</title>
  <meta name="description" content="Log in to access 100 Days 100 Web Projects">
  <link rel="icon" href="favv.png" type="image/png">
  <link rel="stylesheet" href="../design-system.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--ds-space-6);
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--ds-bg-surface);
      border: 1px solid var(--ds-border-default);
      border-radius: var(--ds-radius-xl);
      padding: var(--ds-space-8);
      box-shadow: var(--ds-shadow-lg);
      animation: ds-slide-up 0.4s ease-out;
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--ds-space-8);
    }

    .auth-header h1 {
      font-size: var(--ds-font-size-2xl);
      font-weight: var(--ds-font-weight-semibold);
      color: var(--ds-text-primary);
      margin-bottom: var(--ds-space-2);
    }

    .auth-header p {
      font-size: var(--ds-font-size-sm);
      color: var(--ds-text-muted);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: var(--ds-space-4);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--ds-space-2);
    }

    .form-group label {
      font-size: var(--ds-font-size-sm);
      font-weight: var(--ds-font-weight-medium);
      color: var(--ds-text-primary);
    }

    .auth-footer {
      text-align: center;
      margin-top: var(--ds-space-6);
      font-size: var(--ds-font-size-sm);
      color: var(--ds-text-muted);
    }

    .auth-footer a {
      color: var(--ds-accent-primary);
      text-decoration: none;
      font-weight: var(--ds-font-weight-medium);
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--ds-space-2);
      color: var(--ds-text-muted);
      text-decoration: none;
      font-size: var(--ds-font-size-sm);
      margin-bottom: var(--ds-space-6);
      transition: color var(--ds-transition-base);
    }

    .back-link:hover {
      color: var(--ds-text-primary);
    }
  </style>
</head>

<body class="dark-mode">
  <div>
    <a href="../index.html" class="back-link">
      &larr; Back to Home
    </a>

    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome back</h1>
        <p>Sign in to your account</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="ds-input" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="ds-input" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="ds-btn ds-btn-primary ds-btn-lg ds-w-full" style="margin-top: var(--ds-space-2);">
          Sign in
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="./signup.html">Sign up</a></p>
      </div>
    </div>
  </div>

  <script>
    // Theme initialization
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = saved ? saved === 'dark' : prefersDark;
    document.body.classList.toggle('dark-mode', isDark);
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');

    // Login handler
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (username && password) {
        localStorage.setItem('username', username);
        window.location.pathname = '/index.html';
      }
    });
  </script>
</body>

</html>
