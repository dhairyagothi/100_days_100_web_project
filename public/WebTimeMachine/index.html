<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Design Time Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-era="2020s">
    <div class="time-machine-controls">
        <label for="yearSlider">TIME MACHINE: <span id="yearDisplay">2026</span></label>
        <input type="range" id="yearSlider" min="1995" max="2026" value="2026">
    </div>

    <main class="content-container">
        <header class="hero">
            <h1 class="title">Welcome to the Web</h1>
            <p class="subtitle">Experience how design evolves over time.</p>
        </header>

        <article class="card">
            <h2>The Evolution of Styles</h2>
            <p>Drag the slider above to travel through time. Watch how fonts, colors, borders, and layouts shift dramatically from the early days of the internet to modern design trends.</p>
            <a href="#" class="action-btn">Click Me!</a>
        </article>
    </main>

    <script src="script.js"></script>
</body>
</html>
