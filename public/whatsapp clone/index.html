<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Web Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Chats">
      <div class="sidebar-top">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 11.5c0 4.418-4.03 8-9 8a9.9 9.9 0 0 1-3.3-.56L4 20l1.24-3.02A7.5 7.5 0 0 1 3 11.5c0-4.418 4.03-8 9-8s8 3.582 8 8Z" />
              <path d="M8 10.5h8M8 13.5h5" />
            </svg>
          </div>
          <div>
            <p class="eyebrow">Messenger</p>
            <h1>WhatsApp Clone</h1>
          </div>
        </div>

        <div class="toolbar">
          <button class="icon-button" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
            </svg>
          </button>
          <button class="icon-button mobile-only" id="back-to-list" aria-label="Back to chat list" title="Back to chat list">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
        </div>
      </div>

      <label class="search-box" aria-label="Search chats">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <input id="search-input" type="search" placeholder="Search or start a new chat" autocomplete="off" />
      </label>

      <div class="filters" aria-label="Chat filters">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="unread">Unread</button>
        <button class="chip" data-filter="groups">Groups</button>
        <button class="chip" data-filter="archived">Archived</button>
      </div>

      <div class="chat-list" id="chat-list" role="list"></div>
    </aside>

    <main class="chat-panel" aria-label="Conversation">
      <div class="empty-state" id="empty-state">
        <div class="empty-card">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 11.5c0 4.418-4.03 8-9 8a9.9 9.9 0 0 1-3.3-.56L4 20l1.24-3.02A7.5 7.5 0 0 1 3 11.5c0-4.418 4.03-8 9-8s8 3.582 8 8Z" />
              <path d="M8 10.5h8M8 13.5h4.5" />
            </svg>
          </div>
          <h2>Select a chat to begin</h2>
          <p>Browse the conversation list on the left, then send a message to start the thread.</p>
        </div>
      </div>

      <section class="conversation hidden" id="conversation">
        <header class="chat-header">
          <button class="icon-button mobile-only" id="mobile-list-toggle" aria-label="Open chat list" title="Open chat list">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>

          <div class="peer-meta">
            <div class="avatar-ring" id="peer-avatar">A</div>
            <div>
              <h2 id="peer-name">Alice</h2>
              <p id="peer-status">online</p>
            </div>
          </div>

          <div class="header-actions">
            <button class="icon-button" title="Video call" aria-label="Video call">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 10l4.55-2.27A1 1 0 0 1 21 8.63v6.74a1 1 0 0 1-1.45.9L15 14" />
                <rect x="3" y="7" width="12" height="10" rx="2" />
              </svg>
            </button>
            <button class="icon-button" title="Voice call" aria-label="Voice call">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v2a2 2 0 0 1-2.18 2 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.86 19.86 0 0 1-3.07-8.67A2 2 0 0 1 4.11 1h2a2 2 0 0 1 2 1.72c.12.92.31 1.82.56 2.7a2 2 0 0 1-.45 2.11L7.27 8.48a16 16 0 0 0 6.25 6.25l.95-.95a2 2 0 0 1 2.11-.45c.88.25 1.78.44 2.7.56A2 2 0 0 1 22 16.92Z" />
              </svg>
            </button>
            <button class="icon-button" title="More" aria-label="More options">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="5" r="1" />
                <circle cx="12" cy="12" r="1" />
                <circle cx="12" cy="19" r="1" />
              </svg>
            </button>
          </div>
        </header>

        <div class="message-viewport" id="message-viewport">
          <div class="chat-wall"></div>
          <div class="messages" id="messages"></div>
          <div class="typing hidden" id="typing-indicator">
            <span></span><span></span><span></span>
          </div>
        </div>

        <footer class="composer">
          <button class="icon-button" title="Emoji" aria-label="Emoji">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M8.5 14.5a5 5 0 0 0 7 0" />
              <path d="M9 10h.01M15 10h.01" />
            </svg>
          </button>
          <button class="icon-button" title="Attach" aria-label="Attach">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.5l-8.49 8.49a5.5 5.5 0 0 1-7.78-7.78l8.5-8.49a3.5 3.5 0 1 1 4.95 4.95l-8.49 8.48a1.5 1.5 0 0 1-2.12-2.12l7.78-7.78" />
            </svg>
          </button>

          <label class="composer-input">
            <textarea id="message-input" rows="1" placeholder="Type a message" aria-label="Message input"></textarea>
          </label>

          <button class="send-button" id="send-button" aria-label="Send message">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2L11 13" />
              <path d="M22 2l-7 20-4-9-9-4 20-7Z" />
            </svg>
          </button>
        </footer>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
