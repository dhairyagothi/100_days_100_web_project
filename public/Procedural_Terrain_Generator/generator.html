<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator - Procedural Terrain</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-mode theme-dark">
    
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-mountain-sun"></i>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" title="Home"><i class="fa-solid fa-house"></i></a>
                <a href="generator.html" class="active" title="Generator"><i class="fa-solid fa-map-location-dot"></i></a>
                <a href="settings.html" title="Settings"><i class="fa-solid fa-palette"></i></a>
            </nav>
        </aside>

        <!-- Main Workspace -->
        <main class="workspace">
            
            <!-- Controls Panel -->
            <aside class="controls-panel">
                <h2>Parameters</h2>
                
                <div class="control-group">
                    <label for="input-seed">World Seed</label>
                    <div class="seed-input-group">
                        <input type="text" id="input-seed" value="1337" class="custom-input">
                        <button id="btn-random-seed" class="btn btn-icon" title="Randomize Seed"><i class="fa-solid fa-dice"></i></button>
                    </div>
                </div>
                
                <div class="control-divider"></div>
                
                <div class="control-group">
                    <div class="slider-header">
                        <label for="slider-scale">Noise Scale</label>
                        <span id="val-scale" class="value-display">100</span>
                    </div>
                    <input type="range" id="slider-scale" min="10" max="300" value="100" class="custom-slider">
                    <small class="helper-text">Zoom level of the noise.</small>
                </div>
                
                <div class="control-group">
                    <div class="slider-header">
                        <label for="slider-octaves">Octaves</label>
                        <span id="val-octaves" class="value-display">4</span>
                    </div>
                    <input type="range" id="slider-octaves" min="1" max="8" value="4" class="custom-slider">
                    <small class="helper-text">Level of detail/fractals.</small>
                </div>
                
                <div class="control-group">
                    <div class="slider-header">
                        <label for="slider-persistence">Persistence</label>
                        <span id="val-persistence" class="value-display">0.5</span>
                    </div>
                    <input type="range" id="slider-persistence" min="0.1" max="1.0" step="0.05" value="0.5" class="custom-slider">
                    <small class="helper-text">Amplitude multiplier for octaves.</small>
                </div>
                
                <div class="control-group">
                    <div class="slider-header">
                        <label for="slider-lacunarity">Lacunarity</label>
                        <span id="val-lacunarity" class="value-display">2.0</span>
                    </div>
                    <input type="range" id="slider-lacunarity" min="1.0" max="4.0" step="0.1" value="2.0" class="custom-slider">
                    <small class="helper-text">Frequency multiplier for octaves.</small>
                </div>

                <div class="control-divider"></div>

                <div class="control-group">
                    <div class="slider-header">
                        <label for="slider-sealevel">Sea Level Modifier</label>
                        <span id="val-sealevel" class="value-display">0</span>
                    </div>
                    <input type="range" id="slider-sealevel" min="-0.3" max="0.3" step="0.01" value="0" class="custom-slider">
                </div>

                <div class="control-group checkbox-group">
                    <label class="switch">
                        <input type="checkbox" id="toggle-falloff" checked>
                        <span class="slider round"></span>
                    </label>
                    <span class="checkbox-label">Apply Island Falloff</span>
                </div>
                
                <div class="control-divider"></div>

                <button id="btn-generate" class="btn btn-primary btn-full">Generate Terrain</button>
                <button id="btn-download" class="btn btn-secondary btn-full mt-10"><i class="fa-solid fa-download"></i> Download Image</button>

            </aside>

            <!-- Canvas Container -->
            <div class="canvas-container" id="canvas-container">
                <canvas id="terrain-canvas"></canvas>
            </div>
            
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
