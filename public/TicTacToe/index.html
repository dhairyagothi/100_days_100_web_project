<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Tic Tac Toe</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎲 TIC-TAC-TOE 🎲</h1>
  <div class="container">
    <div class="game-wrapper">
      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
      
      <div class="scoreboard">
        <h2> 🏆Scoreboard</h2>
        <div class="turn-indicator" id="turnIndicator">✨ X's turn ✨
        </div>
        <input type="text" id="playerXNameInput" class="name-input" placeholder="Player X name" value="UserName(X)">
        <input type="text" id="playerONameInput" class="name-input" placeholder="Player O name" value="UserName(O)">
        <div class="score-text" id="playerXWins">🔥 X Wins: 0</div>
        <div class="score-text" id="playerOWins">💧 O Wins: 0</div>
        <div class="score-text" id="drawsCount">🤝 Draws: 0</div>
       <button id="resetScoreBtn">⟳ Reset Scoreboard</button>
       <button id="restartGameBtn">🔄 Restart Game</button>
      </div>
    </div>
    
  </div>

  <!-- Flash card -->
   <div class="winner-flash" id="winnerFlashcard">
    🎉🏆<span id="flashWinnername">WINNER</span>WINS!🎉🎊
   </div>

  <div class="modal" id="resultModal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <p id="resultMessage"></p>
      <button id="newGame"> 🎮 New Game</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
