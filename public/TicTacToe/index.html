<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
</head>
<body>
  <h1>TIC-TAC-TOE</h1>
  <button id="themeToggle" class="theme-btn">
  🌙 Dark Mode
</button>
  <div class="container">
    <div class="game-wrapper">
      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
      <div class="scoreboard">
        <h2>Scoreboard</h2>
        <p id="playerXWins">Player X Wins: 0</p>
        <p id="playerOWins">Player O Wins: 0</p>
        <p id="draws">Draws: 0</p>
        <button id="resetScoreboard">Reset Scoreboard</button>
        <button id="restartGame">Restart Game</button>
      </div>
    </div>

<div class="start-modal" id="startModal" aria-hidden="false" role="dialog" aria-modal="true" aria-labelledby="startTitle">
    <div class="start-card" role="document">
        <div class="start-badge">Start Game</div>
        <h2 class="start-title" id="startTitle">Ready to glow?</h2>
        <p class="start-subtitle">Pick a mode, grab a friend, and light up the grid.</p>
        <div class="start-actions">
            <button class="repeat" id="startGameBtn">Start Playing</button>
        </div>
    </div>
</div>

<div class="winner-modal" id="winnerModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="winnerTitle">
    <div class="winner-card" role="document">
        <div class="winner-badge" id="winnerBadge">Winner</div>
        <h2 class="winner-title" id="winnerTitle">Player O wins!</h2>
        <p class="winner-subtitle" id="winnerSubtitle">Great moves. Ready for the next round?</p>
        <div class="winner-actions">
            <button class="repeat" id="winnerNext">Play Next Round</button>
            <button class="ghost" id="winnerClose">Close</button>
        </div>
    </div>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>

<footer class="footer">
       <span>A TIC TAC TOE GAME TO PLAY WHEN BORED</span>
</footer>
    
    <script src="script.js"></script>
</body>
</html>
