<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe - Enhanced</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="theme-toggle">
    <button id="themeToggle" title="Toggle Dark Mode">🌙</button>
  </div>

  <h1>🎮 TIC-TAC-TOE</h1>
  
  <div class="game-mode-selector">
    <button class="mode-btn active" data-mode="pvp">Player vs Player</button>
    <button class="mode-btn" data-mode="easy">vs AI (Easy)</button>
    <button class="mode-btn" data-mode="hard">vs AI (Hard)</button>
  </div>

  <div class="container">
    <div class="game-wrapper">
      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
      <div class="scoreboard">
        <h2>📊 Scoreboard</h2>
        <p id="playerXWins">Player X Wins: 0</p>
        <p id="playerOWins">Player O Wins: 0</p>
        <p id="draws">Draws: 0</p>
        <button id="resetScoreboard">Reset Scoreboard</button>
        <button id="restartGame">Restart Game</button>
      </div>
    </div>
  </div>

  <div class="modal" id="resultModal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <p id="resultMessage"></p>
      <button id="newGame">New Game</button>
    </div>
  </div>

  <audio id="moveSound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj==" type="audio/wav">
  </audio>
  <audio id="winSound" preload="auto">
    <source src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQIAAAAAAA==" type="audio/wav">
  </audio>

  <script src="script.js"></script>
</body>
</html>
