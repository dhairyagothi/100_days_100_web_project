<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clock Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>World Clock Map</h1>
            <p>Select a region on the map to view its local time</p>
        </header>

        <main>
            <div class="map-container" id="mapContainer">
                </div>

            <div class="time-panel">
                <h2 id="cityName">Select a City</h2>
                <div class="clock" id="clockDisplay">--:--:--</div>
                <div class="date" id="dateDisplay">---</div>
                <div class="timezone" id="timezoneDisplay">UTC</div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
