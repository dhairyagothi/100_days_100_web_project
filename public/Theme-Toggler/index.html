<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Theme Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #1f2937;
      --card-bg: #f3f4f6;
      --card-text-color: #1f2937;
      --primary: #3b82f6;
      --border-color: #e5e7eb;
    }
    
    [data-theme='dark'] {
      --bg-color: #111827;
      --text-color: #f9fafb;
      --card-bg: #1f2937;
      --card-text-color: #f9fafb;
      --primary: #60a5fa;
      --border-color: #374151;
    }

    [data-theme='cyberpunk'] {
      --bg-color: #fce300;
      --text-color: #000000;
      --card-bg: #000000;
      --card-text-color: #ffffff;
      --primary: #00f0ff;
      --border-color: #ff003c;
    }

    [data-theme='synthwave'] {
      --bg-color: #2b213a;
      --text-color: #ff007f;
      --card-bg: #1a1525;
      --card-text-color: #00e5ff;
      --primary: #00e5ff;
      --border-color: #ff007f;
    }

    [data-theme='dracula'] {
      --bg-color: #282a36;
      --text-color: #f8f8f2;
      --card-bg: #44475a;
      --card-text-color: #f8f8f2;
      --primary: #ff79c6;
      --border-color: #6272a4;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: all 0.5s ease;
      margin: 0;
    }

    .theme-card {
      background-color: var(--card-bg);
      color: var(--card-text-color);
      border: 2px solid var(--border-color);
      transition: all 0.5s ease;
    }
    
    .theme-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 2px solid var(--border-color);
    }
    
    /* We make sure unselected buttons in cyberpunk are black/white depending on bg */
    [data-theme='cyberpunk'] .theme-btn {
      color: var(--card-text-color);
    }
    
    .theme-btn:hover, .theme-btn.active {
      background-color: var(--primary);
      color: var(--bg-color);
      border-color: var(--primary);
    }
    
    /* Cyberpunk active button text needs to be black because primary is bright cyan */
    [data-theme='cyberpunk'] .theme-btn.active, 
    [data-theme='cyberpunk'] .theme-btn:hover {
      color: #000000;
    }

    .accent-text {
      color: var(--primary);
    }

    /* Glitch effect for cyberpunk */
    [data-theme='cyberpunk'] .glitch-title {
      text-shadow: 2px 2px 0px var(--primary), -2px -2px 0px var(--border-color);
      letter-spacing: -2px;
    }
  </style>
</head>
<body>
  <div class="min-h-screen flex flex-col justify-center items-center gap-10 p-4">
    
    <div class="text-center">
      <h1 class="glitch-title font-bold text-5xl md:text-6xl mb-4">Theme Engine</h1>
      <p class="text-xl md:text-2xl font-bold opacity-80">Select a theme to transform the UI</p>
    </div>

    <!-- Theme Selection Buttons -->
    <div class="flex flex-wrap justify-center gap-4 z-10">
      <button class="theme-btn active px-6 py-3 rounded-xl font-bold cursor-pointer transition-all duration-300" data-set-theme="light">
        ☀ Light
      </button>
      <button class="theme-btn px-6 py-3 rounded-xl font-bold cursor-pointer transition-all duration-300" data-set-theme="dark">
        🌙 Dark
      </button>
      <button class="theme-btn px-6 py-3 rounded-xl font-bold cursor-pointer transition-all duration-300" data-set-theme="cyberpunk">
        🤖 Cyberpunk
      </button>
      <button class="theme-btn px-6 py-3 rounded-xl font-bold cursor-pointer transition-all duration-300" data-set-theme="synthwave">
        🌆 Synthwave
      </button>
      <button class="theme-btn px-6 py-3 rounded-xl font-bold cursor-pointer transition-all duration-300" data-set-theme="dracula">
        🧛 Dracula
      </button>
    </div>

    <!-- UI Demo Area -->
    <div class="theme-card p-8 rounded-3xl w-full max-w-2xl shadow-2xl mt-8">
      <div class="flex justify-between items-center border-b-2 border-inherit pb-4 mb-6" style="border-color: var(--border-color)">
        <h2 class="text-3xl font-bold">Dashboard Console</h2>
        <div class="flex gap-2">
          <div class="w-4 h-4 rounded-full" style="background-color: var(--primary)"></div>
          <div class="w-4 h-4 rounded-full" style="background-color: var(--border-color)"></div>
        </div>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="p-6 rounded-xl border-2" style="border-color: var(--border-color)">
          <h3 class="font-bold text-xl mb-2 accent-text">Metrics</h3>
          <p class="opacity-80 font-bold mb-1">Connections: <span id="conn-count" class="text-xl">0</span></p>
          <p class="opacity-80 font-bold">Sync Rate: <span id="sync-rate" class="text-xl">0%</span></p>
        </div>
        <div class="p-6 rounded-xl border-2" style="border-color: var(--border-color)">
          <h3 class="font-bold text-xl mb-2 accent-text">Status Check</h3>
          <p class="opacity-80 font-bold mb-1">State: <span id="system-state">IDLE</span></p>
          <p class="opacity-80 font-bold">Latency: <span id="latency">--</span></p>
        </div>
      </div>
      
      <div class="mt-8">
        <button id="executeBtn" class="w-full py-4 rounded-xl font-bold text-lg transition-all active:scale-95 cursor-pointer" style="background-color: var(--primary); color: var(--bg-color)">
          Run Diagnostic Ping
        </button>
      </div>
    </div>

  </div>

  <script>
    const buttons = document.querySelectorAll('.theme-btn');
    const root = document.documentElement;

    // Load saved theme or default to light
    let currentTheme = localStorage.getItem('advanced-theme') || 'light';
    
    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      localStorage.setItem('advanced-theme', theme);
      
      buttons.forEach(btn => {
        if (btn.getAttribute('data-set-theme') === theme) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      
      // Update button text color for specific themes to ensure readability
      const executeBtn = document.getElementById('executeBtn');
      if (theme === 'cyberpunk') {
        executeBtn.style.color = '#000000'; // Black text on cyan button
      } else {
        executeBtn.style.color = 'var(--bg-color)';
      }
    }

    applyTheme(currentTheme);

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        applyTheme(btn.getAttribute('data-set-theme'));
      });
    });

    // Dashboard Interactivity
    const execBtn = document.getElementById('executeBtn');
    const connCount = document.getElementById('conn-count');
    const syncRate = document.getElementById('sync-rate');
    const sysState = document.getElementById('system-state');
    const latency = document.getElementById('latency');

    let baseConn = 0;

    execBtn.addEventListener('click', () => {
      // Simulate activity
      sysState.textContent = "PINGING...";
      sysState.style.color = "var(--border-color)";
      
      setTimeout(() => {
        baseConn += Math.floor(Math.random() * 50) + 10;
        connCount.textContent = baseConn.toLocaleString();
        syncRate.textContent = (Math.random() * 20 + 80).toFixed(1) + "%";
        sysState.textContent = "ONLINE";
        sysState.style.color = "var(--primary)";
        latency.textContent = Math.floor(Math.random() * 30 + 5) + "ms";
      }, 600);
    });
  </script>
</body>
</html>
