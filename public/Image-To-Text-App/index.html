<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Text Conversion</title>
    <link rel="icon" href="../favv.png" type="image/x-icon" />
    <!-- Include Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--Tesseract.js-->
    <script src="https://unpkg.com/tesseract.js@4.0.1/dist/tesseract.min.js"></script>
    <!--PDF.js-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body class="flex items-center justify-center min-h-screen p-4 bg-gradient-to-tr from-blue-700 to-emerald-500">
    <div class="w-full max-w-5xl p-8 border shadow-2xl bg-white/10 backdrop-blur-lg border-white/20 rounded-2xl">
        <h1 class="mb-8 text-4xl font-bold text-center text-white">Image to Text Conversion</h1>
        <!-- Drag and Drop Area --> 
        <div id="dropArea" class="p-8 text-center text-white transition duration-300 border-2 border-white border-dashed cursor-pointer rounded-xl hover:bg-white/10">
             <p class="text-lg font-semibold"> Drag & Drop Image/PDF Here </p> 
             <p class="mt-2 text-sm text-gray-200"> or click below to upload </p> 
             <input type="file" id="fileInput" accept="image/*,.pdf" class="hidden"> 
             <button id="browseBtn" class="px-6 py-2 mt-4 text-white bg-blue-500 rounded-lg hover:bg-blue-700"> Browse File </button> 
        </div>
        <!-- Language Selection --> 
        <div class="mt-6"> 
            <label class="block mb-2 font-semibold text-white"> Select OCR Language </label> 
            <select id="languageSelect" class="w-full p-3 rounded-lg outline-none bg-white/70"> 
              <option value="eng">English</option> <option value="hin">Hindi</option> 
              <option value="ben">Bengali</option> <option value="spa">Spanish</option> 
              <option value="fra">French</option> <option value="deu">German</option> 
            </select> 
        </div>
        <!-- Convert Button --> 
        <button onclick="convertFile()" class="w-full py-3 mt-6 font-bold text-white transition duration-300 rounded-lg bg-emerald-500 hover:bg-emerald-700"> Extract Text </button>
        <!-- Loader --> <div id="loader" class="hidden mt-4 font-semibold text-center text-white"> Processing... </div>
        <!-- Output Section --> 
        <div class="grid grid-cols-1 gap-6 mt-8 md:grid-cols-2"> 
        <!-- Extracted Text --> 
        <div> 
            <h2 class="mb-3 text-xl font-bold text-white"> Extracted Text </h2> 
            <div id="output" class="p-4 overflow-auto whitespace-pre-wrap rounded-lg bg-white/70 h-80"> Upload a file to begin OCR... </div>
            <!-- Download Button --> 
            <button id="downloadBtn" class="hidden w-full py-2 mt-4 text-white bg-blue-500 rounded-lg hover:bg-blue-700"> Download Text </button> 
            <div id="ttsControls" class="hidden mt-4 space-y-3">

    <select
        id="voiceSelect"
        class="w-full p-2 rounded-lg bg-white/70">
    </select>

    <div class="flex gap-2">

        <button
            id="playBtn"
            class="flex-1 py-2 text-white bg-green-500 rounded-lg hover:bg-green-700">

            ▶ Play

        </button>

        <button
            id="pauseBtn"
            class="flex-1 py-2 text-white bg-yellow-500 rounded-lg hover:bg-yellow-700">

            ⏸ Pause

        </button>

        <button
            id="resumeBtn"
            class="flex-1 py-2 text-white bg-blue-500 rounded-lg hover:bg-blue-700">

            ▶ Resume

        </button>

        <button
            id="stopBtn"
            class="flex-1 py-2 text-white bg-red-500 rounded-lg hover:bg-red-700">

            ⏹ Stop

        </button>

    </div>

    <div>

        <label class="block mb-1 text-white">
            Speech Rate
        </label>

        <input
            id="rateControl"
            type="range"
            min="0.5"
            max="2"
            step="0.1"
            value="1"
            class="w-full">

    </div>

    <div>

        <label class="block mb-1 text-white">
            Pitch
        </label>

        <input
            id="pitchControl"
            type="range"
            min="0"
            max="2"
            step="0.1"
            value="1"
            class="w-full">

    </div>

</div>
        </div>
        <!-- Preview --> 
        <div>
            <h2 class="mb-3 text-xl font-bold text-white"> File Preview </h2> 
            <img id="imagePreview" class="hidden object-contain w-full p-2 rounded-lg shadow-lg max-h-80 bg-white/20" src="#" alt="Preview"> 
            <canvas id="pdfCanvas" class="hidden w-full bg-white rounded-lg"></canvas> 
        </div>
     </div> 
    </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
