<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Search Bar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="../favv.png" type="image/x-icon" />
</head>

<body>
  <form class="container" role="search" action="#" method="get" onsubmit="event.preventDefault();">

    <i class="fa-solid fa-magnifying-glass magnifier" aria-hidden="true"></i>

    <input type="text" class="input" placeholder="Search..." aria-label="Search site content" />

    <i class="fa-solid fa-microphone mic-icon" aria-hidden="true"></i>

  </form>

  <script src="app.js"></script>
</body>

</html>
