<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Trip Advisor</title>
    <link rel="stylesheet" href="slider.css">
    <link rel="icon" href="../favv.png" type="image/x-icon" />
</head>
<body>
<header>
    <div class="navbar">
        <h1>TRIP ADVISOR</h1>
        <ul>
            <li><a href="#">HOME</a></li>
            <li><a href="#">CONTACT US</a></li>
            <li><a href="#">ABOUT US</a></li>
            <li><a href="#">SERVICES</a></li>
        </ul>
    </div>
</header>

<div class="content">
    <p id="placeDescription">Explore the beauty of glaciers and the breathtaking landscapes of Iceland.</p>
    <h1 id="placeTitle">Iceland</h1>

    <select id="placeSelector">
        <option value="Iceland">Iceland</option>
        <option value="Switzerland">Switzerland</option>
        <option value="Scotland">Scotland</option>
        <option value="Ireland">Ireland</option>
        <option value="Germany">Germany</option>
        <option value="Snowfields">Snowfields</option>
        <option value="Castelmezzano">Castelmezzano</option>
        <option value="Mountains">Mountains</option>
        <option value="Brooke Holm">Brooke Holm</option>
        <option value="Tobias Hagg">Tobias Hagg</option>
    </select>
    <br>

    <div class="slider-controls">
        <button class="nav-btn" id="prevBtn">&#10094;</button>
        <div class="dots-container" id="dotsContainer"></div>
        <button class="nav-btn" id="nextBtn">&#10095;</button>
    </div>

    <button class="booking" id="bookingButton">Book a Trip to Iceland</button>
</div>

<script>
    const places = [
        { id: "Iceland", file: "iceland.jpg", desc: "Explore the beauty of glaciers and the breathtaking landscapes of Iceland." },
        { id: "Switzerland", file: "Jennifer.avif", desc: "Experience the serene beauty of the Swiss Alps and picturesque villages." },
        { id: "Scotland", file: "Daniel.jpeg", desc: "Discover the rich history and stunning highlands of Scotland." },
        { id: "Ireland", file: "kai.jpg", desc: "Immerse yourself in the lush green landscapes and vibrant culture of Ireland." },
        { id: "Germany", file: "Hannes-Becker4.jpg", desc: "Explore Germany's charming cities and stunning countryside." },
        { id: "Snowfields", file: "snow-3193865.jpg", desc: "Dive into the serene whites of snow-covered fields." },
        { id: "Castelmezzano", file: "castelmezzano.jpg", desc: "Discover the ancient beauty of Castelmezzano, Italy." },
        { id: "Mountains", file: "mountains-862870.jpg", desc: "Witness the majestic grandeur of towering mountain ranges." },
        { id: "Brooke Holm", file: "Brooke-Holm.jpeg", desc: "Iceland captured through the lens of Brooke Holm." },
        { id: "Tobias Hagg", file: "Tobias-Hagg.jpg", desc: "Sweden's landscapes as seen by Tobias Hagg." }
    ];

    const placeBackgrounds = {};
    const placeDescriptions = {};
    places.forEach(p => {
        placeBackgrounds[p.id] = "url('images/" + p.file + "')";
        placeDescriptions[p.id] = p.desc;
    });

    let currentIndex = 0;
    let autoSlideInterval;

    const placeSelector = document.getElementById('placeSelector');
    const bookingButton = document.getElementById('bookingButton');
    const placeTitle = document.getElementById('placeTitle');
    const placeDescription = document.getElementById('placeDescription');
    const dotsContainer = document.getElementById('dotsContainer');
    const body = document.body;

    function updatePlace(place) {
        body.style.backgroundImage = placeBackgrounds[place];
        placeTitle.textContent = place;
        placeDescription.textContent = placeDescriptions[place];
        bookingButton.textContent = "Book a Trip to " + place;
        placeSelector.value = place;
        updateDots(places.findIndex(p => p.id === place));
    }

    function updateDots(index) {
        document.querySelectorAll('.dot').forEach((dot, i) => {
            dot.classList.toggle('active', i === index);
        });
    }

    function goToSlide(index) {
        if (index < 0) index = places.length - 1;
        if (index >= places.length) index = 0;
        currentIndex = index;
        updatePlace(places[currentIndex].id);
        resetAutoSlide();
    }

    function resetAutoSlide() {
        clearInterval(autoSlideInterval);
        autoSlideInterval = setInterval(() => goToSlide(currentIndex + 1), 5000);
    }

    // Build dots
    places.forEach((p, i) => {
        const dot = document.createElement('span');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dot.onclick = () => goToSlide(i);
        dotsContainer.appendChild(dot);
    });

    // Event listeners
    placeSelector.addEventListener('change', function () {
        goToSlide(places.findIndex(p => p.id === placeSelector.value));
    });

    document.getElementById('prevBtn').onclick = () => goToSlide(currentIndex - 1);
    document.getElementById('nextBtn').onclick = () => goToSlide(currentIndex + 1);

    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') goToSlide(currentIndex - 1);
        if (e.key === 'ArrowRight') goToSlide(currentIndex + 1);
    });

    window.onload = function () {
        updatePlace("Iceland");
        placeSelector.value = "Iceland";
        autoSlideInterval = setInterval(() => goToSlide(currentIndex + 1), 5000);
    };
</script>
</body>
</html>
