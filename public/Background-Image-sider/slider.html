<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Background Image Slider</title>
    <link rel="stylesheet" href="slider.css">
    <link rel="icon" href="../favv.png" type="image/x-icon" />
</head>
<body>

    <header class="navbar">
        <div class="navbar-content">
            <h1 style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-weight: bold; font-style: italic;">
                SliderView
            </h1>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#collections">Collections</a></li>
            </ul>
        </div>
    </header>

    <section id="home" class="home-section">
        <div class="slider-background" id="sliderBg"></div>
        <div class="content" style="margin-top: 15vh;">
            <h1 id="placeTitle">Loading Title...</h1>
            <p id="placeDescription">Loading description text...</p>
        </div>

        <div class="content" style="flex-direction: row; gap: 20px; justify-content: center; margin-top: 20px;">
            <button class="booking" id="prevBtn" style="cursor: pointer; max-width: 150px;">Previous</button>
            <button class="booking" id="nextBtn" style="cursor: pointer; max-width: 150px;">Next</button>
        </div>
    </section>

    <script>
        // Data Array matching the folder's asset images paths
        const slideData = [
            {
                image: "url('images/iceland.jpg')",
                title: "Glaciers of Iceland",
                description: "Explore the breathtaking frozen horizons and unique structural volcanic landscapes."
            },
            {
                image: "url('images/Jennifer.avif')",
                title: "The Swiss Alps",
                description: "Experience the calming visuals of peak mountain ranges and classic valleys."
            },
            {
                image: "url('images/Daniel.jpeg')",
                title: "Highlands of Scotland",
                description: "Discover deep valleys, historic horizons, and mist-covered castles."
            },
            {
                image: "url('images/kai.jpg')",
                title: "Emerald Ireland",
                description: "Immerse your view across sweeping oceansides and beautiful fields of green."
            },
            {
                image: "url('images/Hannes-Becker4.jpg')",
                title: "Bavarian Woodlands",
                description: "Journey into classic old-world architecture hidden deep within dense country forests."
            }
        ];

        let currentIndex = 0;

        // DOM Element Selectors mapping exactly to slider.css
        const placeTitle = document.getElementById('placeTitle');
        const placeDescription = document.getElementById('placeDescription');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // Core State Update Loop
        function updateSlider(index) {
            const currentSlide = slideData[index];
            const sliderBg = document.getElementById('sliderBg');
            sliderBg.style.backgroundImage = currentSlide.image;
            placeTitle.textContent = currentSlide.title;
            placeDescription.textContent = currentSlide.description;
        }

        // Navigation Bindings
        nextBtn.addEventListener('click', (e) => {
            e.preventDefault();
            currentIndex = (currentIndex + 1) % slideData.length;
            updateSlider(currentIndex);
        });

        prevBtn.addEventListener('click', (e) => {
            e.preventDefault();
            currentIndex = (currentIndex - 1 + slideData.length) % slideData.length;
            updateSlider(currentIndex);
        });

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                currentIndex = (currentIndex + 1) % slideData.length;
                updateSlider(currentIndex);
            } else if (e.key === 'ArrowLeft') {
                currentIndex = (currentIndex - 1 + slideData.length) % slideData.length;
                updateSlider(currentIndex);
            }
        });

        // Touch/Swipe Navigation
        let touchStartX = 0;
        let touchEndX = 0;

        const homeSection = document.getElementById('home');
        homeSection.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        homeSection.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    // Swiped left - show next
                    currentIndex = (currentIndex + 1) % slideData.length;
                    updateSlider(currentIndex);
                } else {
                    // Swiped right - show previous
                    currentIndex = (currentIndex - 1 + slideData.length) % slideData.length;
                    updateSlider(currentIndex);
                }
            }
        }

        // Initialize display properties immediately on window load
        window.onload = function () {
            updateSlider(currentIndex);
        };
    </script>

    <section id="gallery" class="section">
        <h2>Gallery</h2>
        <div class="image-grid">
            <div class="gallery-item">
                <img src="images/iceland.jpg" alt="Iceland Glaciers">
                <div class="gallery-item-title">Glaciers of Iceland</div>
            </div>
            <div class="gallery-item">
                <img src="images/Jennifer.avif" alt="Swiss Alps">
                <div class="gallery-item-title">The Swiss Alps</div>
            </div>
            <div class="gallery-item">
                <img src="images/Daniel.jpeg" alt="Scotland Highlands">
                <div class="gallery-item-title">Highlands of Scotland</div>
            </div>
            <div class="gallery-item">
                <img src="images/kai.jpg" alt="Emerald Ireland">
                <div class="gallery-item-title">Emerald Ireland</div>
            </div>
            <div class="gallery-item">
                <img src="images/Hannes-Becker4.jpg" alt="Bavarian Woodlands">
                <div class="gallery-item-title">Bavarian Woodlands</div>
            </div>
        </div>
    </section>

    <section id="collections" class="section">
        <h2>Collections</h2>
        <div class="image-grid">
            <div class="gallery-item">
                <img src="images/iceland.jpg" alt="Nordic Collection">
                <div class="gallery-item-title">Nordic Landscapes</div>
            </div>
            <div class="gallery-item">
                <img src="images/Jennifer.avif" alt="Alpine Collection">
                <div class="gallery-item-title">Alpine Peaks</div>
            </div>
            <div class="gallery-item">
                <img src="images/Daniel.jpeg" alt="Celtic Collection">
                <div class="gallery-item-title">Celtic Highlands</div>
            </div>
            <div class="gallery-item">
                <img src="images/kai.jpg" alt="Island Collection">
                <div class="gallery-item-title">Island Paradise</div>
            </div>
            <div class="gallery-item">
                <img src="images/Hannes-Becker4.jpg" alt="European Collection">
                <div class="gallery-item-title">European Heritage</div>
            </div>
        </div>
    </section>
</body>
</html>
