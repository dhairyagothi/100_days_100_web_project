<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Calculator</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="icon" href="../favv.png" type="image/x-icon" />
</head>

<body>
  <a href="/" class="project-back-button" style="position:fixed; left:18px; top:18px; padding:8px 12px; border-radius:8px; background:white; text-decoration:none; z-index:9999; font-weight:700; font-family:Inter, system-ui, sans-serif; color: #000000; box-shadow:0 8px 20px rgba(0, 0, 0, 0.15);">← Back to Home</a>

  <div class="hearts" aria-hidden="true">
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
  </div>

  <main class="main-wrapper">
    <div class="contentbox">
      <div class="card-header">
        <img src="pink-realistic-heart-isolate-on-transparente-background-symbol-love-3d-heart-icon-png.webp" class="corner-heart" alt="Heart Icon">
        <h1><span>Love</span> Calculator</h1>
      </div>
      
      <p class="description">Enter your name and your crush's name to see the chance that this relationship will work out:</p>

      <div class="input-group">
        <input type="text" required id="fname">
        <span class="highlight"></span>
        <span class="bar"></span>
        <label>Your Name</label>
      </div>

      <div class="input-group">
        <input type="text" required id="cname">
        <span class="highlight"></span>
        <span class="bar"></span>
        <label>Crush Name</label>
      </div>

      <div class="action-wrapper">
        <button id="calculate">Calculate</button>
        <p id="loading" class="hidden">Calculating compatibility...</p>
      </div>

      <div class="footer">
        <h2 id="result-message"></h2>
        <p id="result-percentage"></p>
      </div>
    </div>
  </main>
  
  <script src="script.js"></script>
</body>

</html>
