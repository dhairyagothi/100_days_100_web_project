<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jay Hind</title>

    <link href="../indianflag/flag.css" rel="stylesheet" />
    <link rel="icon" href="../favv.png" type="image/x-icon" />
  </head>

  <body>
    <button
      class="theme-toggle"
      id="theme-toggle"
      type="button"
      aria-label="Switch to dark mode"
      title="Switch to dark mode"
    >
      <span id="theme-icon" aria-hidden="true">&#9790;</span>
      <span id="theme-label">Dark Mode</span>
    </button>

    <div class="background-video">
      <video autoplay muted loop id="bg-video">
        <source
          src="https://media.istockphoto.com/id/1503396346/video/happy-indian-republic-day-creative-flag-design-background.mp4?s=mp4-640x640-is&k=20&c=sScbw69iYMiOdC9_KZ2L12EL43ke3lsggE9aK7StIt4="
          type="video/mp4"
        />
        Your browser does not support HTML5 video.
      </video>
    </div>

    <div class="wrapper">

      <div class="flag-assembly">
        <div class="bar">
          <div class="bar-1"></div>
          <div class="bar-2"></div>
          <div class="bar-3"></div>
        </div>

        <div class="flag">
          <div class="top"></div>

          <div class="middle">
            <img
              src="../indianflag/img/ashokchakr.gif"
              alt="Ashoka Chakra"
              draggable="false"
            />
          </div>

          <div class="bottom"></div>
        </div>
      </div>

      <div class="quote-container">
        <div class="image-wrapper">
          <img id="patriot-image" src="" alt="Patriot Image" draggable="false" />
        </div>

        <div class="quote">
          "Give me blood and I will give you freedom."
        </div>

        <div class="author">- Subhas Chandra Bose</div>

        <div class="quote-nav">
          <button id="prev-quote">&#8592;</button>
          <button id="next-quote">&#8594;</button>
        </div>
      </div>
    </div>

    <div class="music-controls">
      <audio id="bgMusic" autoplay loop>
        <source src="vande_mataram.mp3" type="audio/mpeg">
      </audio>

      <div class="custom-player" aria-label="Vande Mataram audio player">
        <button
          class="player-btn"
          id="music-toggle"
          type="button"
          aria-label="Play music"
        >
          <span id="music-icon" class="is-play" aria-hidden="true"></span>
        </button>

        <div class="player-info">
          <div class="player-title">Vande Mataram</div>
          <div class="player-row">
            <span id="music-current">0:00</span>
            <input
              id="music-progress"
              type="range"
              min="0"
              max="100"
              value="0"
              aria-label="Music progress"
            />
            <span id="music-duration">0:00</span>
          </div>
        </div>

        <span class="music-note" aria-hidden="true">&#9835;</span>
      </div>
    </div>

    <script>
      // Quotes data
      const quotes = [
        {
          text: '"Give me blood and I will give you freedom."',
          author: "- Subhas Chandra Bose",
          image: "./img/subhas_bose.png",
        },
        {
          text: '"Swaraj is my birthright and I shall have it."',
          author: "- Bal Gangadhar Tilak",
          image: "./img/bal_tilak.png",
        },
        {
          text: '"Inquilab Zindabad."',
          author: "- Bhagat Singh",
          image: "./img/bhagat_singh.jpg",
        },
        {
          text: '"Jai Jawan Jai Kisan."',
          author: "- Lal Bahadur Shastri",
          image: "./img/lal_bahadur.png",
        },
        {
          text: '"Jai Hind!"',
          author: "- Netaji Subhas Chandra Bose",
          image: "./img/subhas_bose.png",
        },
        {
          text: '"Sarfaroshi ki tamanna ab hamare dil mein hai."',
          author: "- Ram Prasad Bismil",
          image: "./img/ram_prasad.png",
        },
        {
          text:
            '"Dushman ki goliyon ka hum samna karenge, Azad hee rahein hain, azad hee rahenge."',
          author: "- Chandrashekhar Azad",
          image: "./img/azad.png",
        },
        {
          text: '"Satyameva Jayate."',
          author: "- Pandit Madan Mohan Malaviya",
          image: "./img/pandit_madan_mohan.webp",
        },
        {
          text: '"Sarvodaya, Samaj Sudharak, Samaj Sevak."',
          author: "- Mahatma Gandhi",
          image: "./img/gandhi.png",
        },
        {
          text: '"Karo ya maro."',
          author: "- Mahatma Gandhi",
          image: "./img/gandhi.png",
        },
      ];

      let currentQuoteIndex = 0;

      const quoteText = document.querySelector(".quote");
      const quoteAuthor = document.querySelector(".author");
      const patriotImage = document.getElementById("patriot-image");

      function displayQuote() {
  const currentQuote = quotes[currentQuoteIndex];

  // Preload image first
  const img = new Image();

  img.onload = () => {
    patriotImage.src = currentQuote.image;
    patriotImage.alt = currentQuote.author;

    quoteText.textContent = currentQuote.text;
    quoteAuthor.textContent = currentQuote.author;
  };

  img.src = currentQuote.image;
}

      displayQuote();

      setInterval(() => {
        currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
        displayQuote();
      }, 5000);

      document.getElementById("prev-quote").addEventListener("click", () => {
        currentQuoteIndex =
          (currentQuoteIndex - 1 + quotes.length) % quotes.length;
        displayQuote();
      });

      document.getElementById("next-quote").addEventListener("click", () => {
        currentQuoteIndex =
          (currentQuoteIndex + 1) % quotes.length;
        displayQuote();
      });

      const music = document.getElementById("bgMusic");
      const musicToggle = document.getElementById("music-toggle");
      const musicIcon = document.getElementById("music-icon");
      const musicProgress = document.getElementById("music-progress");
      const musicCurrent = document.getElementById("music-current");
      const musicDuration = document.getElementById("music-duration");

      window.addEventListener("load", () => {
        music.play().then(() => {
          updateMusicButton();
        }).catch(() => {
          console.log("Autoplay blocked by browser");
          updateMusicButton();
        });
      });

      function formatTime(seconds) {
        if (!Number.isFinite(seconds)) {
          return "0:00";
        }

        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60)
          .toString()
          .padStart(2, "0");

        return `${minutes}:${remainingSeconds}`;
      }

      function updateMusicButton() {
        const isPlaying = !music.paused;

        musicIcon.classList.toggle("is-pause", isPlaying);
        musicIcon.classList.toggle("is-play", !isPlaying);
        musicToggle.setAttribute(
          "aria-label",
          isPlaying ? "Pause music" : "Play music"
        );
      }

      function updateMusicProgress() {
        const duration = music.duration || 0;
        const progress = duration ? (music.currentTime / duration) * 100 : 0;

        musicProgress.value = progress;
        musicProgress.style.setProperty("--progress", `${progress}%`);
        musicCurrent.textContent = formatTime(music.currentTime);
        musicDuration.textContent = formatTime(duration);
      }

      musicToggle.addEventListener("click", () => {
        if (music.paused) {
          music.play();
        } else {
          music.pause();
        }
      });

      musicProgress.addEventListener("input", () => {
        if (!music.duration) {
          return;
        }

        music.currentTime = (musicProgress.value / 100) * music.duration;
      });

      music.addEventListener("play", updateMusicButton);
      music.addEventListener("pause", updateMusicButton);
      music.addEventListener("loadedmetadata", updateMusicProgress);
      music.addEventListener("timeupdate", updateMusicProgress);

      const themeToggle = document.getElementById("theme-toggle");
      const themeIcon = document.getElementById("theme-icon");
      const themeLabel = document.getElementById("theme-label");

      // Theme preference logic:
      // 1. Use the saved theme from localStorage when available.
      // 2. Otherwise, respect the user's OS-level color scheme preference.
      const savedTheme = localStorage.getItem("indianFlagTheme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const initialTheme = savedTheme ? savedTheme : prefersDark ? "dark" : "light";

      function applyTheme(theme) {
        const isDark = theme === "dark";

        document.body.classList.remove("theme-changing");
        void document.body.offsetWidth;
        document.body.classList.add("theme-changing");
        document.body.classList.toggle("dark-mode", isDark);
        themeIcon.innerHTML = isDark ? "&#9788;" : "&#9790;";
        themeLabel.textContent = isDark ? "Light Mode" : "Dark Mode";
        themeToggle.setAttribute(
          "aria-label",
          isDark ? "Switch to light mode" : "Switch to dark mode"
        );
        themeToggle.setAttribute(
          "title",
          isDark ? "Switch to light mode" : "Switch to dark mode"
        );

        window.setTimeout(() => {
          document.body.classList.remove("theme-changing");
        }, 650);
      }

      applyTheme(savedTheme === "dark" ? "dark" : "light");

      themeToggle.addEventListener("click", () => {
        const nextTheme = document.body.classList.contains("dark-mode")
          ? "light"
          : "dark";

        localStorage.setItem("indianFlagTheme", nextTheme);
        applyTheme(nextTheme);
      });
    </script>
  </body>
</html>
