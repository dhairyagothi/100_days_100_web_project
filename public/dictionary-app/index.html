<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictionary App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <h1>Dictionary</h1>
      <div class="search">
        <input
          type="text"
          id="word-input"
          placeholder="Search word..."
          autofocus
        />
        <button id="search-btn">Search</button>
      </div>
      <div id="error" class="hidden">Word not found.</div>
      <main id="result" class="hidden">
        <div class="header">
          <h2 id="display-word"></h2>
          <button id="audio-btn">🔊 Listen</button>
        </div>
        <div id="meanings"></div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
