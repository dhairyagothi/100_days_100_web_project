<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Saver</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      width: 380px;
      min-height: 450px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .container {
      padding: 16px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      min-height: 400px;
      box-sizing: border-box;
    }

    h2 {
      font-weight: 600;
      font-size: 1.4rem;
      margin: 0 0 16px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-container {
      margin-bottom: 16px;
    }

    #searchInput {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      outline: none;
      box-sizing: border-box;
      font-size: 0.9rem;
    }

    #searchInput::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    #textList {
      max-height: 350px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    #textList::-webkit-scrollbar {
      width: 6px;
    }

    #textList::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .text-entry {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      transition: transform 0.2s;
    }

    .text-entry:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .text-entry p {
      margin: 0 0 8px 0;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #f1f1f1;
    }

    .url {
      font-size: 0.75rem;
      color: #a0aec0;
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 40px;
    }

    .url:hover {
      color: #ebf4ff;
    }

    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: #fc8181;
      cursor: pointer;
      font-size: 1.2rem;
      opacity: 0.6;
      padding: 5px;
      line-height: 1;
    }

    .delete-btn:hover {
      opacity: 1;
      background: rgba(255, 0, 0, 0.1);
      border-radius: 50%;
    }

    .footer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button.action-btn {
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 500;
      cursor: pointer;
      transition: filter 0.2s;
      font-size: 0.85rem;
    }

    #downloadButton {
      background-color: #48bb78;
      color: white;
    }

    #clearButton {
      background-color: rgba(255, 255, 255, 0.15);
      color: #feb2b2;
    }

    button.action-btn:hover {
      filter: brightness(1.1);
    }

    /* Pro Features Styles */
    .tag-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.65rem;
      text-transform: uppercase;
      font-weight: 600;
      background: #4f46e5;
      margin-bottom: 8px;
    }

    .note-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .note-text {
      font-size: 0.8rem;
      font-style: italic;
      color: #cbd5e0;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 5px;
    }

    .note-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-bottom: 8px;
      display: none;
      box-sizing: border-box;
    }

    .utility-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .utility-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .utility-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .citation-box {
      font-size: 0.7rem;
      background: #2d3748;
      padding: 8px;
      border-radius: 6px;
      margin-top: 8px;
      border-left: 3px solid #48bb78;
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>🚀 Text Saver Pro</h2>

    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search by text, source, or tag..." />
    </div>

    <div id="textList"></div>

    <div class="footer-actions">
      <button id="downloadButton" class="action-btn">Export TXT</button>
      <button id="clearButton" class="action-btn">Clear All</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
