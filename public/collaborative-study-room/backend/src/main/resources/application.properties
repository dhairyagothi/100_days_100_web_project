# =============================================================
# Spring Boot Local Development Configuration
# =============================================================

# Enable H2 Web Console for local development
spring.h2.console.enabled=true

# Database Connection Properties
# Use Supabase/Postgres if configured; otherwise use embedded H2 for local runs.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:nexusdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SUPABASE_DB_USER:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# JPA / Hibernate Properties
spring.jpa.database-platform=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
