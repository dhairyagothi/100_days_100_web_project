<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-light">
    
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-pen-nib"></i> MarkItDown</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="active"><i class="fa-solid fa-folder"></i> Documents</a>
                <a href="editor.html"><i class="fa-solid fa-file-pen"></i> Scratchpad</a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
            <div class="sidebar-footer">
                <p>v1.0.0</p>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1>My Documents</h1>
                <a href="editor.html?new=true" class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Document</a>
            </header>

            <div class="dashboard-content">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-docs" placeholder="Search your documents...">
                </div>

                <div class="docs-grid" id="docs-grid">
                    <!-- Documents injected via JS -->
                </div>
                
                <div class="empty-state" id="empty-state" style="display: none;">
                    <i class="fa-regular fa-folder-open"></i>
                    <h3>No documents found</h3>
                    <p>Create a new document to get started.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
